<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${titulo}">Formulario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" href="#">🍰 Catálogo</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/web/catalogo}">Inicio</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/web/catalogo/nuevo}">Nuevo Pastel</a>
                </li>
            </ul>
        </div>
    </div>
</nav>
<div class="container">
    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show">
        <span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="card">
        <div class="card-body">
            <h5 class="card-title" th:text="${titulo}"></h5>
            <form th:action="@{/web/catalogo/guardar}" th:object="${pastel}" method="post">
                <input type="hidden" name="id" th:value="${id}" />
                
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="codigoPastel" class="form-label">Código</label>
                        <input type="text" class="form-control" id="codigoPastel" th:field="*{codigoPastel}" required />
                        <div class="text-danger" th:if="${#fields.hasErrors('codigoPastel')}" th:errors="*{codigoPastel}"></div>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="nombrePastel" class="form-label">Nombre</label>
                        <input type="text" class="form-control" id="nombrePastel" th:field="*{nombrePastel}" required />
                        <div class="text-danger" th:if="${#fields.hasErrors('nombrePastel')}" th:errors="*{nombrePastel}"></div>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="categoria" class="form-label">Categoría</label>
                        <input type="text" class="form-control" id="categoria" th:field="*{categoria}" />
                        <div class="text-danger" th:if="${#fields.hasErrors('categoria')}" th:errors="*{categoria}"></div>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="compraId" class="form-label">ID de Compra</label>
                        <input type="number" class="form-control" id="compraId" th:field="*{compraId}" />
                        <div class="text-danger" th:if="${#fields.hasErrors('compraId')}" th:errors="*{compraId}"></div>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="precioPastel" class="form-label">Precio de Compra</label>
                        <input type="number" step="1" class="form-control" id="precioPastel" th:field="*{precioPastel}" required />
                        <div class="text-danger" th:if="${#fields.hasErrors('precioPastel')}" th:errors="*{precioPastel}"></div>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="precioVenta" class="form-label">Precio de Venta</label>
                        <input type="number" step="1" class="form-control" id="precioVenta" th:field="*{precioVenta}" required />
                        <div class="text-danger" th:if="${#fields.hasErrors('precioVenta')}" th:errors="*{precioVenta}"></div>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="pesoPastel" class="form-label">Peso (g)</label>
                        <input type="number" step="1" class="form-control" id="pesoPastel" th:field="*{pesoPastel}" />
                        <div class="text-danger" th:if="${#fields.hasErrors('pesoPastel')}" th:errors="*{pesoPastel}"></div>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="diasVencimiento" class="form-label">Días de Vencimiento</label>
                        <input type="number" step="1" class="form-control" id="diasVencimiento" th:field="*{diasVencimiento}" />
                        <div class="text-danger" th:if="${#fields.hasErrors('diasVencimiento')}" th:errors="*{diasVencimiento}"></div>
                    </div>
                </div>

                <div class="mt-4">
                    <button type="submit" class="btn btn-primary">Guardar</button>
                    <a th:href="@{/web/catalogo}" class="btn btn-secondary">Cancelar</a>
                </div>
            </form>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
