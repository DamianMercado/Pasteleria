<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Catálogo - Lista</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" href="#">🍰 Catálogo</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/web/catalogo}">Inicio</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/web/catalogo/nuevo}">Nuevo Pastel</a>
                </li>
            </ul>
        </div>
    </div>
</nav>
<div class="container">
    <div th:if="${mensaje}" class="alert alert-success alert-dismissible fade show">
        <span th:text="${mensaje}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show">
        <span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="card">
        <div class="card-body">
            <h5 class="card-title">Lista de Pasteles</h5>
            <div class="table-responsive">
                <table class="table table-striped table-hover mt-3">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Código</th>
                            <th>Nombre</th>
                            <th>Categoría</th>
                            <th>Precio Compra</th>
                            <th>Precio Venta</th>
                            <th>Peso (g)</th>
                            <th>Días Venc.</th>
                            <th>Compra ID</th>
                            <th>Stock</th>
                            <th>Estado Stock</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="p : ${pasteles}">
                            <td th:text="${p.id}"></td>
                            <td th:text="${p.codigoPastel}"></td>
                            <td th:text="${p.nombrePastel}"></td>
                            <td th:text="${p.categoria}"></td>
                            <td th:text="${p.precioPastel}"></td>
                            <td th:text="${p.precioVenta}"></td>
                            <td th:text="${p.pesoPastel}"></td>
                            <td th:text="${p.diasVencimiento}"></td>
                            <td th:text="${p.compraId}"></td>
                            <td th:text="${p.stock != null ? p.stock : 'N/A'}"></td>
                            <td>
                                <span th:if="${p.stock != null and p.stock > 0}" class="badge bg-success" th:text="'Con stock (' + ${p.stock} + ')'"></span>
                                <span th:if="${p.stock != null and p.stock == 0}" class="badge bg-danger">Sin stock</span>
                                <span th:if="${p.stock == null}" class="badge bg-secondary">N/A</span>
                            </td>
                            <td>
                                <a th:href="@{/web/catalogo/{id}/editar(id=${p.id})}" class="btn btn-warning btn-sm">Editar</a>
                                <a th:href="@{/web/catalogo/{id}/eliminar(id=${p.id})}" class="btn btn-danger btn-sm" onclick="return confirm('¿Está seguro de eliminar este pastel?');">Eliminar</a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
