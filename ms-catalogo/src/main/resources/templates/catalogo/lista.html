<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Catálogo - Lista</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div id="wrapper">
    <!-- Navbar Lateral (Sidebar) -->
    <div th:replace="~{fragments/sidebar :: sidebar(activeService='catalogo', activePage='lista')}"></div>

    <!-- Contenido Principal -->
    <div id="page-content-wrapper">
        <div class="container-fluid">
            <div th:if="${mensaje}" class="alert alert-success alert-dismissible fade show">
                <i class="bi bi-check-circle me-1"></i> <span th:text="${mensaje}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
            <div th:if="${error}" class="alert alert-danger alert-dismissible fade show">
                <i class="bi bi-exclamation-triangle me-1"></i> <span th:text="${error}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <div class="card shadow-sm">
                <div class="card-header d-flex justify-content-between align-items-center">
                    <h4 class="mb-0"><i class="bi bi-cake2 me-2"></i>Lista de Pasteles</h4>
                    <a th:href="@{/web/catalogo/nuevo}" class="btn btn-primary btn-sm">
                        <i class="bi bi-plus-lg me-1"></i> Nuevo Pastel
                    </a>
                </div>
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table table-striped table-hover align-middle mt-2">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Código</th>
                                    <th>Categoría</th>
                                    <th>Precio Compra</th>
                                    <th>Precio Venta</th>
                                    <th>Peso (g)</th>
                                    <th>Fecha Venc.</th>
                                    <th>Compra ID</th>
                                    <th>Stock</th>
                                    <th>Estado Stock</th>
                                    <th>Acciones</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="p : ${pasteles}">
                                    <td th:text="${p.id}"></td>
                                    <td><strong th:text="${p.codigoPastel}"></strong></td>
                                    <td><span class="badge bg-secondary" th:text="${p.categoria}"></span></td>
                                    <td th:text="'$' + ${#numbers.formatDecimal(p.precioPastel, 1, 'POINT', 0, 'COMMA')}"></td>
                                    <td class="fw-bold" th:text="'$' + ${#numbers.formatDecimal(p.precioVenta, 1, 'POINT', 0, 'COMMA')}"></td>
                                    <td th:text="${p.pesoPastel}"></td>
                                    <td>
                                        <div th:if="${p.fechaVencimiento != null}">
                                            <span th:text="${#temporals.format(p.fechaVencimiento, 'dd/MM/yyyy')}" class="d-block small"></span>
                                            <span th:if="${p.vencido}" class="badge bg-danger">Vencido</span>
                                            <span th:if="${!p.vencido and p.diasParaVencer == 0}" class="badge bg-warning text-dark">Vence hoy</span>
                                            <span th:if="${!p.vencido and p.diasParaVencer > 0 and p.diasParaVencer <= 3}" class="badge bg-warning text-dark" th:text="'Vence en ' + ${p.diasParaVencer} + ' d'"></span>
                                            <span th:if="${!p.vencido and p.diasParaVencer > 3}" class="badge bg-success">Vigente</span>
                                        </div>
                                        <span th:if="${p.fechaVencimiento == null}" class="badge bg-secondary">Sin fecha</span>
                                    </td>
                                    <td th:text="${p.compraId}"></td>
                                    <td th:text="${p.stock != null ? p.stock : 'N/A'}"></td>
                                    <td>
                                        <span th:if="${p.stock != null and p.stock > 0}" class="badge bg-primary" th:text="'Con stock (' + ${p.stock} + ')'"></span>
                                        <span th:if="${p.stock != null and p.stock == 0}" class="badge bg-danger">Sin stock</span>
                                        <span th:if="${p.stock == null}" class="badge bg-secondary">N/A</span>
                                    </td>
                                    <td>
                                        <div class="btn-group btn-group-sm">
                                            <a th:href="@{/web/catalogo/{id}/editar(id=${p.id})}" class="btn btn-warning"><i class="bi bi-pencil"></i> Editar</a>
                                            <a th:href="@{/web/catalogo/{id}/eliminar(id=${p.id})}" class="btn btn-danger" onclick="return confirm('¿Está seguro de eliminar este pastel?');"><i class="bi bi-trash"></i> Eliminar</a>
                                        </div>
                                    </td>
                                </tr>
                                <tr th:if="${#lists.isEmpty(pasteles)}">
                                    <td colspan="11" class="text-center py-4 text-muted">No hay pasteles registrados.</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
