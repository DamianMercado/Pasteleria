server:
  port: 8080

spring:
  application:
    name: gateway-service

  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        - id: ms-catalogo
          uri: lb://ms-catalogo
          predicates:
            - Path=/api/v1/catalogo/**

        - id: ms-inventario
          uri: lb://ms-inventario
          predicates:
            - Path=/api/v1/inventario/**

        - id: ms-venta
          uri: lb://ms-venta
          predicates:
            - Path=/api/v1/ventas/**

        - id: ms-pago
          uri: lb://ms-pago
          predicates:
            - Path=/api/v1/pagos/**

        - id: ms-compra
          uri: lb://ms-compra
          predicates:
            - Path=/api/v1/compras/**

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${spring.application.instance_id:${random.value}}

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    gateway:
      enabled: true

logging:
  level:
    root: INFO
    org.springframework.cloud.gateway: INFO