<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Nueva Compra</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" href="#">🍰 MS-Compra</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav">
                <li class="nav-item"><a class="nav-link" th:href="@{/web/compras}">Inicio</a></li>
                <li class="nav-item"><a class="nav-link active" th:href="@{/web/compras/nueva}">Nueva Compra</a></li>
            </ul>
        </div>
    </div>
</nav>
<div class="container">
    <div th:if="${mensaje}" class="alert alert-success alert-dismissible fade show">
        <span th:text="${mensaje}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show">
        <span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <h2 class="mb-4">Registrar Nueva Compra</h2>
    
    <form th:action="@{/web/compras/guardar}" method="post">
        <div class="card mb-4">
            <div class="card-header bg-secondary text-white">
                <h5 class="card-title mb-0">Datos del Proveedor</h5>
            </div>
            <div class="card-body">
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="proveedorNombre" class="form-label">Nombre del Proveedor *</label>
                        <input type="text" class="form-control" id="proveedorNombre" name="proveedorNombre" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="proveedorContacto" class="form-label">Contacto (Opcional)</label>
                        <input type="text" class="form-control" id="proveedorContacto" name="proveedorContacto">
                    </div>
                </div>
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="costoTransporte" class="form-label">Costo de Transporte *</label>
                        <input type="number" step="0.01" class="form-control" id="costoTransporte" name="costoTransporte" value="0" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="notas" class="form-label">Notas</label>
                        <textarea class="form-control" id="notas" name="notas" rows="2"></textarea>
                    </div>
                </div>
            </div>
        </div>

        <div class="card mb-4">
            <div class="card-header bg-secondary text-white d-flex justify-content-between align-items-center">
                <h5 class="card-title mb-0">Ítems de Compra</h5>
                <button type="button" class="btn btn-sm btn-light" onclick="agregarItem()">+ Agregar Ítem</button>
            </div>
            <div class="card-body">
                <table class="table" id="itemsTable">
                    <thead>
                        <tr>
                            <th>Producto</th>
                            <th>Cantidad</th>
                            <th>Precio Unitario</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody id="itemsBody">
                        <!-- Default 3 rows -->
                        <tr>
                            <td><input type="text" class="form-control" name="nombreProducto" required></td>
                            <td><input type="number" class="form-control" name="cantidad" min="1" required></td>
                            <td><input type="number" step="0.01" class="form-control" name="precioUnitario" min="0" required></td>
                            <td><button type="button" class="btn btn-danger btn-sm" onclick="this.closest('tr').remove()">X</button></td>
                        </tr>
                        <tr>
                            <td><input type="text" class="form-control" name="nombreProducto"></td>
                            <td><input type="number" class="form-control" name="cantidad" min="1"></td>
                            <td><input type="number" step="0.01" class="form-control" name="precioUnitario" min="0"></td>
                            <td><button type="button" class="btn btn-danger btn-sm" onclick="this.closest('tr').remove()">X</button></td>
                        </tr>
                        <tr>
                            <td><input type="text" class="form-control" name="nombreProducto"></td>
                            <td><input type="number" class="form-control" name="cantidad" min="1"></td>
                            <td><input type="number" step="0.01" class="form-control" name="precioUnitario" min="0"></td>
                            <td><button type="button" class="btn btn-danger btn-sm" onclick="this.closest('tr').remove()">X</button></td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div class="mb-5">
            <button type="submit" class="btn btn-primary">Registrar Compra</button>
            <a th:href="@{/web/compras}" class="btn btn-secondary">Cancelar</a>
        </div>
    </form>
</div>
<script>
    function agregarItem() {
        const tbody = document.getElementById('itemsBody');
        const tr = document.createElement('tr');
        tr.innerHTML = `
            <td><input type="text" class="form-control" name="nombreProducto" required></td>
            <td><input type="number" class="form-control" name="cantidad" min="1" required></td>
            <td><input type="number" step="0.01" class="form-control" name="precioUnitario" min="0" required></td>
            <td><button type="button" class="btn btn-danger btn-sm" onclick="this.closest('tr').remove()">X</button></td>
        `;
        tbody.appendChild(tr);
    }
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
