<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Nueva Compra</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div id="wrapper">
    <!-- Navbar Lateral (Sidebar) -->
    <div th:replace="~{fragments/sidebar :: sidebar(activeService='compras', activePage='nueva')}"></div>

    <!-- Contenido Principal -->
    <div id="page-content-wrapper">
        <div class="container-fluid">
            <div th:if="${mensaje}" class="alert alert-success alert-dismissible fade show">
                <i class="bi bi-check-circle me-1"></i> <span th:text="${mensaje}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
            <div th:if="${error}" class="alert alert-danger alert-dismissible fade show">
                <i class="bi bi-exclamation-triangle me-1"></i> <span th:text="${error}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <!-- Formulario envuelto en Card Principal -->
            <div class="card shadow-sm">
                <div class="card-header">
                    <h4><i class="bi bi-cart-plus me-2"></i>Registrar Nueva Compra</h4>
                </div>
                <form th:action="@{/web/compras/guardar}" method="post">
                    <div class="card-body p-4">
                        <!-- Sección 1: Datos del Proveedor -->
                        <div class="card mb-4" style="border-color: #edd5c0;">
                            <div class="card-header py-2" style="background: #f2d6a1;">
                                <h6 class="card-title mb-0"><i class="bi bi-building me-1"></i> Datos del Proveedor</h6>
                            </div>
                            <div class="card-body">
                                <div class="row">
                                    <div class="col-md-6 mb-3">
                                        <label for="proveedorNombre" class="form-label">Nombre del Proveedor *</label>
                                        <input type="text" class="form-control" id="proveedorNombre" name="proveedorNombre" required>
                                    </div>
                                    <div class="col-md-6 mb-3">
                                        <label for="proveedorContacto" class="form-label">Contacto (Opcional)</label>
                                        <input type="text" class="form-control" id="proveedorContacto" name="proveedorContacto">
                                    </div>
                                </div>
                                <div class="row">
                                    <div class="col-md-6 mb-3">
                                        <label for="costoTransporte" class="form-label">Costo de Transporte *</label>
                                        <input type="number" step="0.01" class="form-control" id="costoTransporte" name="costoTransporte" value="0" required>
                                    </div>
                                    <div class="col-md-6 mb-3">
                                        <label for="notas" class="form-label">Notas</label>
                                        <textarea class="form-control" id="notas" name="notas" rows="2"></textarea>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Sección 2: Ítems de Compra -->
                        <div class="card mb-3" style="border-color: #edd5c0;">
                            <div class="card-header py-2 d-flex justify-content-between align-items-center" style="background: #f2d6a1;">
                                <h6 class="card-title mb-0"><i class="bi bi-basket me-1"></i> Ítems de Compra</h6>
                                <button type="button" class="btn btn-sm btn-primary" onclick="agregarItem()">
                                    <i class="bi bi-plus-lg me-1"></i> Agregar Ítem
                                </button>
                            </div>
                            <div class="card-body">
                                <table class="table align-middle" id="itemsTable">
                                    <thead>
                                        <tr>
                                            <th>Código Pastel</th>
                                            <th>Cantidad</th>
                                            <th>Precio Unitario</th>
                                            <th style="width: 50px;"></th>
                                        </tr>
                                    </thead>
                                    <tbody id="itemsBody">
                                        <tr>
                                            <td><input type="text" class="form-control" name="codigoPastel" required placeholder="Código del pastel (ej: PST-01)"></td>
                                            <td><input type="number" class="form-control" name="cantidad" min="1" required placeholder="Cantidad"></td>
                                            <td><input type="number" step="0.01" class="form-control" name="precioUnitario" min="0" required placeholder="Precio unitario"></td>
                                            <td><button type="button" class="btn btn-outline-danger btn-sm" onclick="this.closest('tr').remove()"><i class="bi bi-trash"></i></button></td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>

                    <!-- Pie del Formulario con Botones dentro de la Card -->
                    <div class="card-footer d-flex gap-2">
                        <button type="submit" class="btn btn-primary px-4"><i class="bi bi-check-lg me-1"></i> Registrar Compra</button>
                        <a th:href="@{/web/compras}" class="btn btn-secondary px-4"><i class="bi bi-x-circle me-1"></i> Cancelar</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
<script>
    function agregarItem() {
        const tbody = document.getElementById('itemsBody');
        const tr = document.createElement('tr');
        tr.innerHTML = `
            <td><input type="text" class="form-control" name="codigoPastel" required placeholder="Código del pastel (ej: PST-01)"></td>
            <td><input type="number" class="form-control" name="cantidad" min="1" required placeholder="Cantidad"></td>
            <td><input type="number" step="0.01" class="form-control" name="precioUnitario" min="0" required placeholder="Precio unitario"></td>
            <td><button type="button" class="btn btn-outline-danger btn-sm" onclick="this.closest('tr').remove()"><i class="bi bi-trash"></i></button></td>
        `;
        tbody.appendChild(tr);
    }
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
