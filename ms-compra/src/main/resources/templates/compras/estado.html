<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Actualizar Estado</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" href="#">🍰 MS-Compra</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav">
                <li class="nav-item"><a class="nav-link" th:href="@{/web/compras}">Inicio</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/web/compras/nueva}">Nueva Compra</a></li>
            </ul>
        </div>
    </div>
</nav>
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card mt-5">
                <div class="card-header bg-primary text-white">
                    <h4 class="mb-0">Actualizar Estado - Compra #<span th:text="${compra.id}"></span></h4>
                </div>
                <div class="card-body">
                    <p><strong>Proveedor:</strong> <span th:text="${compra.proveedorNombre}"></span></p>
                    <p><strong>Estado Actual:</strong> 
                        <span th:text="${compra.estadoCompra}" class="badge bg-secondary"></span>
                    </p>
                    
                    <form th:action="@{/web/compras/{id}/estado(id=${compra.id})}" method="post">
                        <div class="mb-3 mt-4">
                            <label for="nuevoEstado" class="form-label">Nuevo Estado:</label>
                            <select class="form-select" id="nuevoEstado" name="nuevoEstado" required>
                                <option th:each="estado : ${estados}" 
                                        th:value="${estado}" 
                                        th:text="${estado}"
                                        th:selected="${estado == compra.estadoCompra}"></option>
                            </select>
                        </div>
                        <div class="mt-4">
                            <button type="submit" class="btn btn-primary">Actualizar Estado</button>
                            <a th:href="@{/web/compras}" class="btn btn-secondary">Cancelar</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
