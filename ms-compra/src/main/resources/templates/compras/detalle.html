<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Detalle de Compra</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div id="wrapper">
    <!-- Navbar Lateral (Sidebar) -->
    <div th:replace="~{fragments/sidebar :: sidebar(activeService='compras', activePage='lista')}"></div>

    <!-- Contenido Principal -->
    <div id="page-content-wrapper">
        <div class="container-fluid">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h3 class="mb-0 fw-bold"><i class="bi bi-receipt-cutoff me-2"></i>Detalle de Compra #<span th:text="${compra.id}"></span></h3>
                <div class="d-flex gap-2">
                    <a th:href="@{/web/compras/{id}/estado(id=${compra.id})}" class="btn btn-primary"><i class="bi bi-arrow-repeat me-1"></i> Cambiar Estado</a>
                    <a th:href="@{/web/compras}" class="btn btn-secondary"><i class="bi bi-arrow-left me-1"></i> Volver</a>
                </div>
            </div>
            
            <div class="row">
                <div class="col-md-6 mb-4">
                    <div class="card h-100 shadow-sm">
                        <div class="card-header">
                            <h5 class="card-title mb-0"><i class="bi bi-info-circle me-1"></i> Información General</h5>
                        </div>
                        <div class="card-body">
                            <p><strong>Proveedor:</strong> <span th:text="${compra.proveedorNombre}"></span></p>
                            <p><strong>Contacto:</strong> <span th:text="${compra.proveedorContacto}"></span></p>
                            <p><strong>Fecha:</strong> <span th:text="${#temporals.format(compra.fechaCompra, 'dd/MM/yyyy HH:mm')}"></span></p>
                            <p><strong>Estado:</strong> 
                                <span th:text="${compra.estadoCompra}" 
                                      th:class="${compra.estadoCompra.name() == 'PENDIENTE' ? 'badge bg-warning' : 
                                                 compra.estadoCompra.name() == 'RECIBIDA' ? 'badge bg-info' : 
                                                 compra.estadoCompra.name() == 'COMPLETADA' ? 'badge bg-primary' : 'badge bg-danger'}">
                                </span>
                            </p>
                            <p class="mb-0"><strong>Notas:</strong> <span th:text="${compra.notas}"></span></p>
                        </div>
                    </div>
                </div>
                
                <div class="col-md-6 mb-4">
                    <div class="card h-100 shadow-sm">
                        <div class="card-header">
                            <h5 class="card-title mb-0"><i class="bi bi-cash-coin me-1"></i> Resumen Financiero</h5>
                        </div>
                        <div class="card-body">
                            <p><strong>Total Productos:</strong> $<span th:text="${compra.totalProductos}"></span></p>
                            <p><strong>Costo Transporte:</strong> $<span th:text="${compra.costoTransporte}"></span></p>
                            <h4 class="mt-3 fw-bold" style="color: #f1a805;"><strong>Total Compra:</strong> $<span th:text="${compra.totalCompra}"></span></h4>
                            <hr>
                            <p class="mb-0" style="color: #749288;"><strong>Ganancia Obtenida:</strong> $<span th:text="${compra.gananciaObtenida}"></span></p>
                        </div>
                    </div>
                </div>
            </div>

            <div class="card shadow-sm mb-4">
                <div class="card-header">
                    <h5 class="card-title mb-0"><i class="bi bi-basket me-1"></i> Productos Comprados</h5>
                </div>
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table table-striped align-middle">
                            <thead>
                                <tr>
                                    <th>Código Pastel</th>
                                    <th>Cantidad</th>
                                    <th>Precio Unit.</th>
                                    <th>Subtotal</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="item : ${compra.items}">
                                    <td class="fw-bold" th:text="${item.nombreProducto}"></td>
                                    <td th:text="${item.cantidad}"></td>
                                    <td th:text="${'$' + item.precioUnitario}"></td>
                                    <td class="fw-bold" th:text="${'$' + (item.precioUnitario * item.cantidad)}"></td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
