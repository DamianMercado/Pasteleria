<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Lista de Compras</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" href="#">🍰 MS-Compra</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/web/compras}">Inicio</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/web/compras/nueva}">Nueva Compra</a>
                </li>
            </ul>
        </div>
    </div>
</nav>
<div class="container">
    <div th:if="${mensaje}" class="alert alert-success alert-dismissible fade show">
        <span th:text="${mensaje}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show">
        <span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <h2 class="mb-4">Órdenes de Compra</h2>
    
    <table class="table table-striped table-hover">
        <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Proveedor</th>
            <th>Contacto</th>
            <th>Fecha</th>
            <th>Transporte</th>
            <th>Total Prod.</th>
            <th>Total Compra</th>
            <th>Estado</th>
            <th>Acciones</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="compra : ${compras}">
            <td th:text="${compra.id}"></td>
            <td th:text="${compra.proveedorNombre}"></td>
            <td th:text="${compra.proveedorContacto}"></td>
            <td th:text="${#temporals.format(compra.fechaCompra, 'dd/MM/yyyy HH:mm')}"></td>
            <td th:text="${'$' + compra.costoTransporte}"></td>
            <td th:text="${'$' + compra.totalProductos}"></td>
            <td th:text="${'$' + compra.totalCompra}"></td>
            <td>
                <span th:text="${compra.estadoCompra}" 
                      th:class="${compra.estadoCompra.name() == 'PENDIENTE' ? 'badge bg-warning' : 
                                 compra.estadoCompra.name() == 'RECIBIDA' ? 'badge bg-info' : 
                                 compra.estadoCompra.name() == 'COMPLETADA' ? 'badge bg-success' : 'badge bg-danger'}">
                </span>
            </td>
            <td>
                <a th:href="@{/web/compras/{id}(id=${compra.id})}" class="btn btn-sm btn-info">Ver</a>
                <a th:href="@{/web/compras/{id}/estado(id=${compra.id})}" class="btn btn-sm btn-primary">Estado</a>
                <a th:if="${compra.estadoCompra.name() != 'CANCELADA'}" 
                   th:href="@{/web/compras/{id}/cancelar(id=${compra.id})}" 
                   class="btn btn-sm btn-danger" 
                   onclick="return confirm('¿Está seguro de cancelar esta compra?');">Cancelar</a>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(compras)}">
            <td colspan="9" class="text-center">No hay compras registradas</td>
        </tr>
        </tbody>
    </table>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
