<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Lista de Compras</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div id="wrapper">
    <!-- Navbar Lateral (Sidebar) -->
    <div th:replace="~{fragments/sidebar :: sidebar(activeService='compras', activePage='lista')}"></div>

    <!-- Contenido Principal -->
    <div id="page-content-wrapper">
        <div class="container-fluid">
            <div th:if="${mensaje}" class="alert alert-success alert-dismissible fade show">
                <i class="bi bi-check-circle me-1"></i> <span th:text="${mensaje}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
            <div th:if="${error}" class="alert alert-danger alert-dismissible fade show">
                <i class="bi bi-exclamation-triangle me-1"></i> <span th:text="${error}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <div class="card shadow-sm">
                <div class="card-header d-flex justify-content-between align-items-center">
                    <h4 class="mb-0"><i class="bi bi-bag me-2"></i>Órdenes de Compra</h4>
                    <a th:href="@{/web/compras/nueva}" class="btn btn-primary btn-sm">
                        <i class="bi bi-plus-lg me-1"></i> Nueva Compra
                    </a>
                </div>
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table table-striped table-hover align-middle">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Proveedor</th>
                                    <th>Contacto</th>
                                    <th>Fecha</th>
                                    <th>Transporte</th>
                                    <th>Total Prod.</th>
                                    <th>Total Compra</th>
                                    <th>Estado</th>
                                    <th>Acciones</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="compra : ${compras}">
                                    <td th:text="${compra.id}"></td>
                                    <td><strong th:text="${compra.proveedorNombre}"></strong></td>
                                    <td th:text="${compra.proveedorContacto}"></td>
                                    <td th:text="${#temporals.format(compra.fechaCompra, 'dd/MM/yyyy HH:mm')}"></td>
                                    <td th:text="'$' + ${compra.costoTransporte}"></td>
                                    <td th:text="'$' + ${compra.totalProductos}"></td>
                                    <td class="fw-bold" th:text="'$' + ${compra.totalCompra}"></td>
                                    <td>
                                        <span th:text="${compra.estadoCompra}" 
                                              th:class="${compra.estadoCompra.name() == 'PENDIENTE' ? 'badge bg-warning' : 
                                                         compra.estadoCompra.name() == 'RECIBIDA' ? 'badge bg-info' : 
                                                         compra.estadoCompra.name() == 'COMPLETADA' ? 'badge bg-primary' : 'badge bg-danger'}">
                                        </span>
                                    </td>
                                    <td>
                                        <div class="btn-group btn-group-sm">
                                            <a th:href="@{/web/compras/{id}(id=${compra.id})}" class="btn btn-info"><i class="bi bi-eye"></i> Ver</a>
                                            <a th:href="@{/web/compras/{id}/estado(id=${compra.id})}" class="btn btn-warning"><i class="bi bi-arrow-repeat"></i> Estado</a>
                                            <a th:if="${compra.estadoCompra.name() != 'CANCELADA'}" 
                                               th:href="@{/web/compras/{id}/cancelar(id=${compra.id})}" 
                                               class="btn btn-danger" 
                                               onclick="return confirm('¿Está seguro de cancelar esta compra?');"><i class="bi bi-x-circle"></i> Cancelar</a>
                                        </div>
                                    </td>
                                </tr>
                                <tr th:if="${#lists.isEmpty(compras)}">
                                    <td colspan="9" class="text-center py-4 text-muted">No hay compras registradas</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
