<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Formulario Inventario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" href="#">📦 Inventario</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/web/inventario}">Inicio</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/web/inventario/nuevo}">Nuevo Ítem</a>
                </li>
            </ul>
        </div>
    </div>
</nav>
<div class="container">
    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show">
        <span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <h2 th:text="${id != null} ? 'Editar Ítem' : 'Nuevo Ítem'">Formulario Ítem</h2>
    <div class="card mt-4">
        <div class="card-body">
            <form th:action="@{/web/inventario/guardar}" th:object="${item}" method="post">
                <input type="hidden" name="id" th:value="${id}" />
                <div class="mb-3">
                    <label class="form-label">Código Pastel</label>
                    <input type="text" class="form-control" th:field="*{codigoPastel}">
                    <span class="text-danger" th:if="${#fields.hasErrors('codigoPastel')}" th:errors="*{codigoPastel}"></span>
                </div>
                <div class="mb-3">
                    <label class="form-label">Nombre Pastel</label>
                    <input type="text" class="form-control" th:field="*{nombrePastel}">
                    <span class="text-danger" th:if="${#fields.hasErrors('nombrePastel')}" th:errors="*{nombrePastel}"></span>
                </div>
                <div class="mb-3">
                    <label class="form-label">Stock</label>
                    <input type="number" class="form-control" th:field="*{stock}">
                    <span class="text-danger" th:if="${#fields.hasErrors('stock')}" th:errors="*{stock}"></span>
                </div>
                <div class="mb-3">
                    <label class="form-label">Compra ID</label>
                    <input type="number" class="form-control" th:field="*{compraId}">
                </div>
                <button type="submit" class="btn btn-success">Guardar</button>
                <a th:href="@{/web/inventario}" class="btn btn-secondary">Cancelar</a>
            </form>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
