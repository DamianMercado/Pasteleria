<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Inventario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" href="#">📦 Inventario</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/web/inventario}">Inicio</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/web/inventario/nuevo}">Nuevo Ítem</a>
                </li>
            </ul>
        </div>
    </div>
</nav>
<div class="container">
    <div th:if="${mensaje}" class="alert alert-success alert-dismissible fade show">
        <span th:text="${mensaje}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show">
        <span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <h2>Listado de Inventario</h2>
    <table class="table table-striped table-hover mt-4">
        <thead>
        <tr>
            <th>ID</th>
            <th>Código</th>
            <th>Nombre</th>
            <th>Stock</th>
            <th>Venta Costo</th>
            <th>Compra ID</th>
            <th>Estado</th>
            <th>Acciones</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="i : ${items}" th:class="${i.alertaStockBajo ? 'table-danger' : ''}">
            <td th:text="${i.id}"></td>
            <td th:text="${i.codigoPastel}"></td>
            <td th:text="${i.nombrePastel}"></td>
            <td th:text="${i.stock}"></td>
            <td th:text="${i.ventaCosto}"></td>
            <td th:text="${i.compraId}"></td>
            <td>
                <span th:if="${i.alertaStockBajo}" class="badge bg-danger">STOCK BAJO</span>
                <span th:unless="${i.alertaStockBajo}" class="badge bg-success">OK</span>
            </td>
            <td>
                <a class="btn btn-warning btn-sm" th:href="@{/web/inventario/{id}/editar(id=${i.id})}">Editar</a>
                <a class="btn btn-secondary btn-sm" th:href="@{/web/inventario/{codigo}/movimientos(codigo=${i.codigoPastel})}">Movimientos</a>
                <a class="btn btn-danger btn-sm" th:href="@{/web/inventario/{id}/eliminar(id=${i.id})}" onclick="return confirm('¿Está seguro de eliminar este ítem?')">Eliminar</a>
            </td>
        </tr>
        </tbody>
    </table>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
