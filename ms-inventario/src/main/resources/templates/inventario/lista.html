<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Inventario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div id="wrapper">
    <!-- Navbar Lateral (Sidebar) -->
    <div th:replace="~{fragments/sidebar :: sidebar(activeService='inventario', activePage='lista')}"></div>

    <!-- Contenido Principal -->
    <div id="page-content-wrapper">
        <div class="container-fluid">
            <div th:if="${mensaje}" class="alert alert-success alert-dismissible fade show">
                <i class="bi bi-check-circle me-1"></i> <span th:text="${mensaje}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
            <div th:if="${error}" class="alert alert-danger alert-dismissible fade show">
                <i class="bi bi-exclamation-triangle me-1"></i> <span th:text="${error}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <div class="card shadow-sm">
                <div class="card-header d-flex justify-content-between align-items-center">
                    <h4 class="mb-0"><i class="bi bi-boxes me-2"></i>Control de Inventario</h4>
                    <a th:href="@{/web/inventario/nuevo}" class="btn btn-primary btn-sm">
                        <i class="bi bi-plus-lg me-1"></i> Nuevo Ítem
                    </a>
                </div>
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table table-striped table-hover align-middle">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Código</th>
                                    <th>Nombre</th>
                                    <th>Compra ID</th>
                                    <th>Stock Lote</th>
                                    <th>Stock Total</th>
                                    <th>Vencimiento</th>
                                    <th>Venta Costo</th>
                                    <th>Estado Stock</th>
                                    <th>Acciones</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="i : ${items}" th:class="${i.alertaStockBajo ? 'table-danger' : ''}">
                                    <td th:text="${i.id}"></td>
                                    <td><strong th:text="${i.codigoPastel}"></strong></td>
                                    <td th:text="${i.nombrePastel}"></td>
                                    <td>
                                        <span th:if="${i.compraId != null}" class="badge bg-secondary" th:text="'#' + ${i.compraId}"></span>
                                        <span th:unless="${i.compraId != null}" class="text-muted">-</span>
                                    </td>
                                    <td><span class="fw-bold fs-6" th:text="${i.stock}"></span></td>
                                    <td>
                                        <span class="badge bg-primary fs-6" title="Stock acumulado del producto" th:text="${i.stockTotalProducto != null ? i.stockTotalProducto : i.stock}"></span>
                                    </td>
                                    <td>
                                        <div th:if="${i.fechaVencimiento != null}">
                                            <span th:text="${#temporals.format(i.fechaVencimiento, 'dd/MM/yyyy')}"></span>
                                            <br/>
                                            <span th:if="${i.vencido}" class="badge bg-danger">Vencido</span>
                                            <span th:if="${!i.vencido and i.diasParaVencer != null and i.diasParaVencer <= 3}" 
                                                  class="badge bg-warning text-dark" 
                                                  th:text="${i.diasParaVencer == 0 ? 'Vence hoy' : 'Vence en ' + i.diasParaVencer + ' d'}"></span>
                                            <span th:if="${!i.vencido and (i.diasParaVencer == null or i.diasParaVencer > 3)}" 
                                                  class="badge bg-success">Vigente</span>
                                        </div>
                                        <span th:unless="${i.fechaVencimiento != null}" class="text-muted small">Sin fecha</span>
                                    </td>
                                    <td th:text="${i.ventaCosto}"></td>
                                    <td>
                                        <span th:if="${i.alertaStockBajo}" class="badge bg-danger">STOCK BAJO</span>
                                        <span th:unless="${i.alertaStockBajo}" class="badge bg-secondary">OK</span>
                                    </td>
                                    <td>
                                        <div class="btn-group btn-group-sm">
                                            <a class="btn btn-warning" th:href="@{/web/inventario/{id}/editar(id=${i.id})}"><i class="bi bi-pencil"></i> Editar</a>
                                            <a class="btn btn-info" th:href="@{/web/inventario/{codigo}/movimientos(codigo=${i.codigoPastel})}"><i class="bi bi-arrow-left-right"></i> Movimientos</a>
                                            <a class="btn btn-danger" th:href="@{/web/inventario/{id}/eliminar(id=${i.id})}" onclick="return confirm('¿Está seguro de eliminar este ítem?')"><i class="bi bi-trash"></i> Eliminar</a>
                                        </div>
                                    </td>
                                </tr>
                                <tr th:if="${#lists.isEmpty(items)}">
                                    <td colspan="10" class="text-center py-4 text-muted">No hay ítems registrados en el inventario.</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
