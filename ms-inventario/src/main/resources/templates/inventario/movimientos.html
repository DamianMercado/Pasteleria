<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Movimientos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" href="#">📦 Inventario</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/web/inventario}">Inicio</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/web/inventario/nuevo}">Nuevo Ítem</a>
                </li>
            </ul>
        </div>
    </div>
</nav>
<div class="container">
    <h2 th:text="'Movimientos para el código: ' + ${codigoPastel}">Movimientos</h2>
    <a class="btn btn-secondary mb-3 mt-2" th:href="@{/web/inventario}">Volver al listado</a>
    
    <table class="table table-striped table-hover">
        <thead>
        <tr>
            <th>ID</th>
            <th>Tipo</th>
            <th>Cantidad</th>
            <th>Motivo</th>
            <th>Fecha</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="m : ${movimientos}">
            <td th:text="${m.id}"></td>
            <td th:text="${m.tipoMovimiento}"></td>
            <td th:text="${m.cantidad}"></td>
            <td th:text="${m.motivo}"></td>
            <td th:text="${#temporals.format(m.fechaMovimiento, 'dd/MM/yyyy HH:mm')}"></td>
        </tr>
        <tr th:if="${#lists.isEmpty(movimientos)}">
            <td colspan="5" class="text-center">No hay movimientos registrados.</td>
        </tr>
        </tbody>
    </table>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
