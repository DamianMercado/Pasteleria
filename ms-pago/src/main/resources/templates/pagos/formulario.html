<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Editar Pago</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div id="wrapper">
    <!-- Navbar Lateral (Sidebar) -->
    <div th:replace="~{fragments/sidebar :: sidebar(activeService='pagos', activePage='lista')}"></div>

    <!-- Contenido Principal -->
    <div id="page-content-wrapper">
        <div class="container-fluid">
            <div th:if="${mensaje}" class="alert alert-success alert-dismissible fade show">
                <i class="bi bi-check-circle me-1"></i> <span th:text="${mensaje}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
            <div th:if="${error}" class="alert alert-danger alert-dismissible fade show">
                <i class="bi bi-exclamation-triangle me-1"></i> <span th:text="${error}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
            <div th:if="${ventaError}" class="alert alert-warning alert-dismissible fade show">
                <i class="bi bi-info-circle me-1"></i> <span th:text="${ventaError}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <!-- Card: Información de la Venta y Cliente -->
            <div class="card shadow-sm mb-4">
                <div class="card-header d-flex justify-content-between align-items-center">
                    <h4 class="mb-0">
                        <i class="bi bi-receipt me-2"></i>Detalles de la Venta y Cliente
                    </h4>
                    <span class="badge bg-secondary fs-6" th:text="'Venta #' + ${pago.ventaId}"></span>
                </div>
                <div class="card-body p-4">
                    <div class="row g-3">
                        <div class="col-md-4">
                            <div class="p-3 bg-light rounded border">
                                <span class="text-muted d-block small">Cliente</span>
                                <strong class="fs-5 text-dark" th:text="${venta != null ? venta.clienteNombre : pago.clienteNombre}"></strong>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="p-3 bg-light rounded border">
                                <span class="text-muted d-block small">Dirección</span>
                                <strong class="fs-6 text-dark" th:text="${venta != null and (venta.calle != null or venta.ciudad != null) ? (venta.calle + ', ' + venta.ciudad) : 'No especificada'}"></strong>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="p-3 bg-light rounded border">
                                <span class="text-muted d-block small">Fecha de la Venta</span>
                                <strong class="fs-6 text-dark" th:text="${venta != null and venta.fechaVenta != null ? #temporals.format(venta.fechaVenta, 'dd/MM/yyyy HH:mm') : 'N/A'}"></strong>
                            </div>
                        </div>
                    </div>

                    <!-- Detalle de Productos si están disponibles -->
                    <div th:if="${venta != null and venta.items != null and !#lists.isEmpty(venta.items)}" class="mt-4">
                        <h6 class="fw-bold mb-2"><i class="bi bi-basket me-1"></i> Productos Vendidos:</h6>
                        <div class="table-responsive">
                            <table class="table table-sm table-bordered align-middle">
                                <thead>
                                    <tr>
                                        <th>Cód. Pastel</th>
                                        <th>Producto</th>
                                        <th class="text-center">Cantidad</th>
                                        <th class="text-end">Precio Unit.</th>
                                        <th class="text-end">Subtotal</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="item : ${venta.items}">
                                        <td><span class="badge bg-secondary" th:text="${item.codigoPastel}"></span></td>
                                        <td th:text="${item.nombrePastel}"></td>
                                        <td class="text-center" th:text="${item.cantidad}"></td>
                                        <td class="text-end" th:text="'$' + ${#numbers.formatDecimal(item.precioUnitario, 1, 'POINT', 0, 'COMMA')}"></td>
                                        <td class="text-end fw-bold" th:text="'$' + ${#numbers.formatDecimal(item.subtotal, 1, 'POINT', 0, 'COMMA')}"></td>
                                    </tr>
                                </tbody>
                                <tfoot>
                                    <tr class="table-light">
                                        <th colspan="4" class="text-end">Total de la Venta:</th>
                                        <th class="text-end text-primary fw-bold fs-6" th:text="'$' + ${#numbers.formatDecimal(venta.totalVenta, 1, 'POINT', 0, 'COMMA')}"></th>
                                    </tr>
                                </tfoot>
                            </table>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Card: Formulario de Edición del Pago -->
            <div class="card shadow-sm">
                <div class="card-header d-flex justify-content-between align-items-center">
                    <h4 class="mb-0"><i class="bi bi-pencil-square me-2"></i>Editar Pago #<span th:text="${pagoId}"></span></h4>
                    <span th:if="${pagoOriginal != null and pagoOriginal.numeroComprobante != null}" class="badge bg-info text-dark" th:text="'Comprobante: ' + ${pagoOriginal.numeroComprobante}"></span>
                </div>
                <div class="card-body p-4">
                    <form th:action="@{/web/pagos/{id}/editar(id=${pagoId})}" th:object="${pago}" method="post">
                        <!-- Campos requeridos ocultos -->
                        <input type="hidden" th:field="*{ventaId}">
                        <input type="hidden" th:field="*{clienteNombre}">

                        <div class="row">
                            <div class="col-md-4 mb-3">
                                <label for="monto" class="form-label">Monto del Pago</label>
                                <div class="input-group">
                                    <span class="input-group-text">$</span>
                                    <input type="number" step="1" class="form-control" id="monto" th:field="*{monto}" required>
                                </div>
                                <span class="text-danger small mt-1" th:if="${#fields.hasErrors('monto')}" th:errors="*{monto}"></span>
                            </div>
                            <div class="col-md-4 mb-3">
                                <label for="metodoPago" class="form-label">Método de Pago</label>
                                <select class="form-select" id="metodoPago" th:field="*{metodoPago}" required>
                                    <option th:each="metodo : ${metodosPago}" 
                                            th:value="${metodo}" 
                                            th:text="${metodo}"></option>
                                </select>
                                <span class="text-danger small mt-1" th:if="${#fields.hasErrors('metodoPago')}" th:errors="*{metodoPago}"></span>
                            </div>
                            <div class="col-md-4 mb-3">
                                <label for="estadoPago" class="form-label">Estado del Pago</label>
                                <select class="form-select" id="estadoPago" th:field="*{estadoPago}" required>
                                    <option th:each="estado : ${estadosPago}" 
                                            th:value="${estado}" 
                                            th:text="${estado}"></option>
                                </select>
                                <span class="text-danger small mt-1" th:if="${#fields.hasErrors('estadoPago')}" th:errors="*{estadoPago}"></span>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3" id="fechaVencimientoDiv" style="display: none;">
                                <label for="fechaVencimiento" class="form-label">Fecha de Vencimiento</label>
                                <input type="datetime-local" class="form-control" id="fechaVencimiento" th:field="*{fechaVencimiento}">
                                <span class="text-danger small mt-1" th:if="${#fields.hasErrors('fechaVencimiento')}" th:errors="*{fechaVencimiento}"></span>
                            </div>
                            <div class="col-md-12 mb-3">
                                <label for="notas" class="form-label">Notas u Observaciones</label>
                                <textarea class="form-control" id="notas" th:field="*{notas}" rows="3" placeholder="Observaciones adicionales sobre el pago..."></textarea>
                            </div>
                        </div>
                        
                        <div class="mt-4 pt-3 border-top d-flex gap-2">
                            <button type="submit" class="btn btn-primary px-4"><i class="bi bi-check-lg me-1"></i> Guardar Cambios</button>
                            <a th:href="@{/web/pagos}" class="btn btn-secondary px-4"><i class="bi bi-x-circle me-1"></i> Cancelar</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    const metodoSelect = document.getElementById('metodoPago');
    const vencimientoDiv = document.getElementById('fechaVencimientoDiv');
    
    function toggleVencimiento() {
        if (metodoSelect.value === 'FIADO') {
            vencimientoDiv.style.display = 'block';
        } else {
            vencimientoDiv.style.display = 'none';
        }
    }

    metodoSelect.addEventListener('change', toggleVencimiento);
    toggleVencimiento();
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
