<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Comprobante de Pago</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div id="wrapper">
    <!-- Navbar Lateral (Sidebar) -->
    <div th:replace="~{fragments/sidebar :: sidebar(activeService='pagos', activePage='lista')}"></div>

    <!-- Contenido Principal -->
    <div id="page-content-wrapper">
        <div class="container-fluid">
            <div th:if="${mensaje}" class="alert alert-success alert-dismissible fade show">
                <i class="bi bi-check-circle me-1"></i> <span th:text="${mensaje}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
            <div th:if="${error}" class="alert alert-danger alert-dismissible fade show">
                <i class="bi bi-exclamation-triangle me-1"></i> <span th:text="${error}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
            
            <div class="row justify-content-center">
                <div class="col-lg-8 col-md-10">
                    <div class="card shadow-sm">
                        <div class="card-header d-flex justify-content-between align-items-center">
                            <h4 class="card-title mb-0"><i class="bi bi-receipt me-2"></i>Comprobante de Pago</h4>
                            <span class="badge bg-secondary" th:text="'#' + ${pago.numeroComprobante}"></span>
                        </div>
                        <div class="card-body p-4">
                            <div class="row mb-3">
                                <div class="col-sm-4 fw-bold text-muted">ID del Pago:</div>
                                <div class="col-sm-8" th:text="${pago.id}"></div>
                            </div>
                            <div class="row mb-3">
                                <div class="col-sm-4 fw-bold text-muted">N° Comprobante:</div>
                                <div class="col-sm-8 fw-bold" th:text="${pago.numeroComprobante}"></div>
                            </div>
                            <div class="row mb-3">
                                <div class="col-sm-4 fw-bold text-muted">Venta ID:</div>
                                <div class="col-sm-8"><span class="badge bg-info" th:text="'#' + ${pago.ventaId}"></span></div>
                            </div>
                            <div class="row mb-3">
                                <div class="col-sm-4 fw-bold text-muted">Cliente:</div>
                                <div class="col-sm-8 fw-semibold" th:text="${pago.clienteNombre}"></div>
                            </div>
                            <div class="row mb-3">
                                <div class="col-sm-4 fw-bold text-muted">Monto:</div>
                                <div class="col-sm-8 fs-5 fw-bold" style="color: #f1a805;" th:text="${#numbers.formatDecimal(pago.monto, 1, 'POINT', 0, 'COMMA')} + ' CLP'"></div>
                            </div>
                            <div class="row mb-3">
                                <div class="col-sm-4 fw-bold text-muted">Método de Pago:</div>
                                <div class="col-sm-8"><span class="badge bg-secondary" th:text="${pago.metodoPago}"></span></div>
                            </div>
                            <div class="row mb-3">
                                <div class="col-sm-4 fw-bold text-muted">Estado:</div>
                                <div class="col-sm-8">
                                    <span th:if="${pago.estadoPago.name() == 'PAGADO'}" class="badge bg-primary" th:text="${pago.estadoPago}"></span>
                                    <span th:if="${pago.estadoPago.name() == 'PENDIENTE'}" class="badge bg-warning" th:text="${pago.estadoPago}"></span>
                                    <span th:if="${pago.estadoPago.name() == 'ANULADO'}" class="badge bg-danger" th:text="${pago.estadoPago}"></span>
                                </div>
                            </div>
                            <div class="row mb-3">
                                <div class="col-sm-4 fw-bold text-muted">Fecha de Pago:</div>
                                <div class="col-sm-8" th:text="${#temporals.format(pago.fechaPago, 'dd/MM/yyyy HH:mm')}"></div>
                            </div>
                            
                            <div class="row mb-3" th:if="${pago.metodoPago.name() == 'FIADO'}">
                                <div class="col-sm-4 fw-bold text-muted">Fecha Vencimiento:</div>
                                <div class="col-sm-8" th:text="${#temporals.format(pago.fechaVencimiento, 'dd/MM/yyyy HH:mm')}"></div>
                            </div>
                            
                            <div class="row mb-0" th:if="${pago.notas != null and !pago.notas.isEmpty()}">
                                <div class="col-sm-4 fw-bold text-muted">Notas:</div>
                                <div class="col-sm-8" th:text="${pago.notas}"></div>
                            </div>
                        </div>
                        <div class="card-footer d-flex gap-2">
                            <a th:href="@{/web/pagos}" class="btn btn-secondary px-4"><i class="bi bi-arrow-left me-1"></i> Volver</a>
                            
                            <a th:if="${pago.estadoPago.name() == 'PENDIENTE'}" 
                               th:href="@{/web/pagos/{id}/pagar(id=${pago.id})}" 
                               class="btn btn-primary"><i class="bi bi-check2-circle me-1"></i> Marcar como Pagado</a>
                               
                            <a th:if="${pago.estadoPago.name() != 'ANULADO'}" 
                               th:href="@{/web/pagos/{id}/anular(id=${pago.id})}" 
                               class="btn btn-danger" 
                               onclick="return confirm('¿Está seguro de anular este pago?');"><i class="bi bi-x-circle me-1"></i> Anular</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
