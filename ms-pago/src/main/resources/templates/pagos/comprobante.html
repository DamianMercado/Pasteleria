<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Comprobante de Pago</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" href="#">🍰 ms-pago</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/web/pagos}">Inicio</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/web/pagos/nuevo}">Nuevo Pago</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/web/pagos/fiados}">Fiados Pendientes</a>
                </li>
            </ul>
        </div>
    </div>
</nav>
<div class="container">
    <div th:if="${mensaje}" class="alert alert-success alert-dismissible fade show">
        <span th:text="${mensaje}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show">
        <span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card mt-4">
                <div class="card-header bg-dark text-white">
                    <h4 class="card-title mb-0">Comprobante de Pago</h4>
                </div>
                <div class="card-body">
                    <div class="row mb-3">
                        <div class="col-sm-4 fw-bold">ID del Pago:</div>
                        <div class="col-sm-8" th:text="${pago.id}"></div>
                    </div>
                    <div class="row mb-3">
                        <div class="col-sm-4 fw-bold">N° Comprobante:</div>
                        <div class="col-sm-8" th:text="${pago.numeroComprobante}"></div>
                    </div>
                    <div class="row mb-3">
                        <div class="col-sm-4 fw-bold">Venta ID:</div>
                        <div class="col-sm-8" th:text="${pago.ventaId}"></div>
                    </div>
                    <div class="row mb-3">
                        <div class="col-sm-4 fw-bold">Cliente:</div>
                        <div class="col-sm-8" th:text="${pago.clienteNombre}"></div>
                    </div>
                    <div class="row mb-3">
                        <div class="col-sm-4 fw-bold">Monto:</div>
                        <div class="col-sm-8" th:text="${#numbers.formatDecimal(pago.monto, 1, 'POINT', 0, 'COMMA')} + ' CLP'"></div>
                    </div>
                    <div class="row mb-3">
                        <div class="col-sm-4 fw-bold">Método de Pago:</div>
                        <div class="col-sm-8" th:text="${pago.metodoPago}"></div>
                    </div>
                    <div class="row mb-3">
                        <div class="col-sm-4 fw-bold">Estado:</div>
                        <div class="col-sm-8">
                            <span th:if="${pago.estadoPago.name() == 'PAGADO'}" class="badge bg-success" th:text="${pago.estadoPago}"></span>
                            <span th:if="${pago.estadoPago.name() == 'PENDIENTE'}" class="badge bg-warning text-dark" th:text="${pago.estadoPago}"></span>
                            <span th:if="${pago.estadoPago.name() == 'ANULADO'}" class="badge bg-danger" th:text="${pago.estadoPago}"></span>
                        </div>
                    </div>
                    <div class="row mb-3">
                        <div class="col-sm-4 fw-bold">Fecha de Pago:</div>
                        <div class="col-sm-8" th:text="${#temporals.format(pago.fechaPago, 'dd/MM/yyyy HH:mm')}"></div>
                    </div>
                    
                    <div class="row mb-3" th:if="${pago.metodoPago.name() == 'FIADO'}">
                        <div class="col-sm-4 fw-bold">Fecha Vencimiento:</div>
                        <div class="col-sm-8" th:text="${#temporals.format(pago.fechaVencimiento, 'dd/MM/yyyy HH:mm')}"></div>
                    </div>
                    
                    <div class="row mb-3" th:if="${pago.notas != null and !pago.notas.isEmpty()}">
                        <div class="col-sm-4 fw-bold">Notas:</div>
                        <div class="col-sm-8" th:text="${pago.notas}"></div>
                    </div>
                </div>
                <div class="card-footer">
                    <a th:href="@{/web/pagos}" class="btn btn-secondary">Volver</a>
                    
                    <a th:if="${pago.estadoPago.name() == 'PENDIENTE'}" 
                       th:href="@{/web/pagos/{id}/pagar(id=${pago.id})}" 
                       class="btn btn-success ms-2">Marcar como Pagado</a>
                       
                    <a th:if="${pago.estadoPago.name() != 'ANULADO'}" 
                       th:href="@{/web/pagos/{id}/anular(id=${pago.id})}" 
                       class="btn btn-danger ms-2"
                       onclick="return confirm('¿Está seguro de anular este pago?');">Anular</a>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
