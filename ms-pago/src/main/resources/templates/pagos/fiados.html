<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Lista de Fiados Pendientes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" href="#">🍰 ms-pago</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/web/pagos}">Inicio</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/web/pagos/nuevo}">Nuevo Pago</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active" th:href="@{/web/pagos/fiados}">Fiados Pendientes</a>
                </li>
            </ul>
        </div>
    </div>
</nav>
<div class="container">
    <div th:if="${mensaje}" class="alert alert-success alert-dismissible fade show">
        <span th:text="${mensaje}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show">
        <span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    
    <h2>📋 Lista de Fiados Pendientes</h2>
    
    <div th:if="${fiados.empty}" class="alert alert-info mt-4">
        No hay pagos fiados pendientes.
    </div>
    
    <table th:if="${!fiados.empty}" class="table table-striped table-hover mt-4">
        <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Venta ID</th>
                <th>Cliente</th>
                <th>Monto</th>
                <th>Fecha Pago</th>
                <th>Fecha Vencimiento</th>
                <th>Días Restantes</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="fiado : ${fiados}">
                <td th:text="${fiado.id}"></td>
                <td th:text="${fiado.ventaId}"></td>
                <td th:text="${fiado.clienteNombre}"></td>
                <td th:text="${#numbers.formatDecimal(fiado.monto, 1, 'POINT', 0, 'COMMA')}"></td>
                <td th:text="${#temporals.format(fiado.fechaPago, 'dd/MM/yyyy HH:mm')}"></td>
                <td th:text="${#temporals.format(fiado.fechaVencimiento, 'dd/MM/yyyy HH:mm')}"></td>
                <td>
                    <span th:if="${diasRestantes.get(fiado.id) < 0}" class="text-danger fw-bold" th:text="${diasRestantes.get(fiado.id)} + ' (Vencido)'"></span>
                    <span th:if="${diasRestantes.get(fiado.id) >= 0 and diasRestantes.get(fiado.id) < 3}" class="text-warning fw-bold" th:text="${diasRestantes.get(fiado.id)}"></span>
                    <span th:if="${diasRestantes.get(fiado.id) >= 3}" class="text-success" th:text="${diasRestantes.get(fiado.id)}"></span>
                </td>
                <td>
                    <a th:href="@{/web/pagos/{id}/pagar(id=${fiado.id})}" 
                       class="btn btn-sm btn-success"
                       onclick="return confirm('¿Está seguro de marcar este pago como pagado?');">Marcar Pagado</a>
                    <a th:href="@{/web/pagos/{id}(id=${fiado.id})}" class="btn btn-sm btn-primary">Ver Detalle</a>
                </td>
            </tr>
        </tbody>
    </table>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
