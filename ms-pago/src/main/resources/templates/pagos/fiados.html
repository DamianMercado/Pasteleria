<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Lista de Fiados Pendientes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div id="wrapper">
    <!-- Navbar Lateral (Sidebar) -->
    <div th:replace="~{fragments/sidebar :: sidebar(activeService='pagos', activePage='fiados')}"></div>

    <!-- Contenido Principal -->
    <div id="page-content-wrapper">
        <div class="container-fluid">
            <div th:if="${mensaje}" class="alert alert-success alert-dismissible fade show">
                <i class="bi bi-check-circle me-1"></i> <span th:text="${mensaje}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
            <div th:if="${error}" class="alert alert-danger alert-dismissible fade show">
                <i class="bi bi-exclamation-triangle me-1"></i> <span th:text="${error}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <div class="card shadow-sm">
                <div class="card-header d-flex justify-content-between align-items-center">
                    <h4 class="mb-0"><i class="bi bi-hourglass-split me-2"></i>Fiados Pendientes</h4>
                </div>
                <div class="card-body">
                    <div th:if="${fiados.empty}" class="alert alert-info mb-0">
                        <i class="bi bi-info-circle me-2"></i> No hay pagos fiados pendientes en este momento.
                    </div>
                    
                    <div th:if="${!fiados.empty}" class="table-responsive">
                        <table class="table table-striped table-hover align-middle">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Venta ID</th>
                                    <th>Cliente</th>
                                    <th>Monto</th>
                                    <th>Fecha Pago</th>
                                    <th>Fecha Vencimiento</th>
                                    <th>Días Restantes</th>
                                    <th>Acciones</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="fiado : ${fiados}">
                                    <td th:text="${fiado.id}"></td>
                                    <td><span class="badge bg-secondary" th:text="'#' + ${fiado.ventaId}"></span></td>
                                    <td><strong th:text="${fiado.clienteNombre}"></strong></td>
                                    <td class="fw-bold" th:text="'$' + ${#numbers.formatDecimal(fiado.monto, 1, 'POINT', 0, 'COMMA')}"></td>
                                    <td th:text="${#temporals.format(fiado.fechaPago, 'dd/MM/yyyy HH:mm')}"></td>
                                    <td th:text="${#temporals.format(fiado.fechaVencimiento, 'dd/MM/yyyy HH:mm')}"></td>
                                    <td>
                                        <span th:if="${diasRestantes.get(fiado.id) < 0}" class="badge bg-danger" th:text="${diasRestantes.get(fiado.id)} + ' días (Vencido)'"></span>
                                        <span th:if="${diasRestantes.get(fiado.id) >= 0 and diasRestantes.get(fiado.id) < 3}" class="badge bg-warning" th:text="${diasRestantes.get(fiado.id)} + ' días por vencer'"></span>
                                        <span th:if="${diasRestantes.get(fiado.id) >= 3}" class="badge bg-primary" th:text="${diasRestantes.get(fiado.id)} + ' días'"></span>
                                    </td>
                                    <td>
                                        <div class="btn-group btn-group-sm">
                                            <a th:href="@{/web/pagos/{id}/editar(id=${fiado.id})}" class="btn btn-warning"><i class="bi bi-pencil"></i> Editar</a>
                                            <a th:href="@{/web/pagos/{id}/pagar(id=${fiado.id})}" 
                                               class="btn btn-primary"
                                               onclick="return confirm('¿Está seguro de marcar este pago como pagado?');"><i class="bi bi-check2-circle"></i> Marcar Pagado</a>
                                            <a th:href="@{/web/pagos/{id}(id=${fiado.id})}" class="btn btn-info"><i class="bi bi-receipt"></i> Detalle</a>
                                        </div>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
