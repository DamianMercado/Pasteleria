<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Lista de Pagos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div id="wrapper">
    <!-- Navbar Lateral (Sidebar) -->
    <div th:replace="~{fragments/sidebar :: sidebar(activeService='pagos', activePage='lista')}"></div>

    <!-- Contenido Principal -->
    <div id="page-content-wrapper">
        <div class="container-fluid">
            <div th:if="${mensaje}" class="alert alert-success alert-dismissible fade show">
                <i class="bi bi-check-circle me-1"></i> <span th:text="${mensaje}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
            <div th:if="${error}" class="alert alert-danger alert-dismissible fade show">
                <i class="bi bi-exclamation-triangle me-1"></i> <span th:text="${error}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <div class="card shadow-sm">
                <div class="card-header d-flex justify-content-between align-items-center">
                    <h4 class="mb-0"><i class="bi bi-cash-stack me-2"></i>Historial de Pagos</h4>
                    <div class="d-flex gap-2">
                        <a th:href="@{/web/pagos/fiados}" class="btn btn-warning btn-sm">
                            <i class="bi bi-hourglass-split me-1"></i> Fiados Pendientes
                        </a>
                    </div>
                </div>
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table table-striped table-hover align-middle">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Venta ID</th>
                                    <th>Cliente</th>
                                    <th>Monto</th>
                                    <th>Método</th>
                                    <th>Estado</th>
                                    <th>Fecha Pago</th>
                                    <th>Comprobante</th>
                                    <th>Acciones</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="pago : ${pagos}">
                                    <td th:text="${pago.id}"></td>
                                    <td><span class="badge bg-secondary" th:text="'#' + ${pago.ventaId}"></span></td>
                                    <td><strong th:text="${pago.clienteNombre}"></strong></td>
                                    <td class="fw-bold" th:text="'$' + ${#numbers.formatDecimal(pago.monto, 1, 'POINT', 0, 'COMMA')}"></td>
                                    <td><span class="badge bg-info" th:text="${pago.metodoPago}"></span></td>
                                    <td>
                                        <span th:if="${pago.estadoPago.name() == 'PAGADO'}" class="badge bg-primary" th:text="${pago.estadoPago}"></span>
                                        <span th:if="${pago.estadoPago.name() == 'PENDIENTE'}" class="badge bg-warning" th:text="${pago.estadoPago}"></span>
                                        <span th:if="${pago.estadoPago.name() == 'ANULADO'}" class="badge bg-danger" th:text="${pago.estadoPago}"></span>
                                    </td>
                                    <td th:text="${#temporals.format(pago.fechaPago, 'dd/MM/yyyy HH:mm')}"></td>
                                    <td th:text="${pago.numeroComprobante}"></td>
                                    <td>
                                        <div class="btn-group btn-group-sm">
                                            <a th:href="@{/web/pagos/{id}/editar(id=${pago.id})}" class="btn btn-warning"><i class="bi bi-pencil"></i> Editar</a>
                                            <a th:href="@{/web/pagos/{id}(id=${pago.id})}" class="btn btn-info"><i class="bi bi-receipt"></i> Ver</a>
                                            <a th:if="${pago.estadoPago.name() != 'ANULADO'}" 
                                               th:href="@{/web/pagos/{id}/anular(id=${pago.id})}" 
                                               class="btn btn-danger" 
                                               onclick="return confirm('¿Está seguro de anular este pago?');"><i class="bi bi-x-circle"></i> Anular</a>
                                        </div>
                                    </td>
                                </tr>
                                <tr th:if="${#lists.isEmpty(pagos)}">
                                    <td colspan="9" class="text-center py-4 text-muted">No hay pagos registrados</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
