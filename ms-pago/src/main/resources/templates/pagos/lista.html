<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Lista de Pagos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" href="#">🍰 ms-pago</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/web/pagos}">Inicio</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/web/pagos/nuevo}">Nuevo Pago</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/web/pagos/fiados}">Fiados Pendientes</a>
                </li>
            </ul>
        </div>
    </div>
</nav>
<div class="container">
    <div th:if="${mensaje}" class="alert alert-success alert-dismissible fade show">
        <span th:text="${mensaje}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show">
        <span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    
    <h2>📋 Lista de Pagos</h2>
    <table class="table table-striped table-hover mt-4">
        <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Venta ID</th>
                <th>Cliente</th>
                <th>Monto</th>
                <th>Método</th>
                <th>Estado</th>
                <th>Fecha Pago</th>
                <th>Comprobante</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="pago : ${pagos}">
                <td th:text="${pago.id}"></td>
                <td th:text="${pago.ventaId}"></td>
                <td th:text="${pago.clienteNombre}"></td>
                <td th:text="${#numbers.formatDecimal(pago.monto, 1, 'POINT', 0, 'COMMA')}"></td>
                <td th:text="${pago.metodoPago}"></td>
                <td>
                    <span th:if="${pago.estadoPago.name() == 'PAGADO'}" class="badge bg-success" th:text="${pago.estadoPago}"></span>
                    <span th:if="${pago.estadoPago.name() == 'PENDIENTE'}" class="badge bg-warning text-dark" th:text="${pago.estadoPago}"></span>
                    <span th:if="${pago.estadoPago.name() == 'ANULADO'}" class="badge bg-danger" th:text="${pago.estadoPago}"></span>
                </td>
                <td th:text="${#temporals.format(pago.fechaPago, 'dd/MM/yyyy HH:mm')}"></td>
                <td th:text="${pago.numeroComprobante}"></td>
                <td>
                    <a th:href="@{/web/pagos/{id}(id=${pago.id})}" class="btn btn-sm btn-primary">Ver</a>
                    <a th:if="${pago.estadoPago.name() != 'ANULADO'}" 
                       th:href="@{/web/pagos/{id}/anular(id=${pago.id})}" 
                       class="btn btn-sm btn-danger" 
                       onclick="return confirm('¿Está seguro de anular este pago?');">Anular</a>
                </td>
            </tr>
        </tbody>
    </table>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
