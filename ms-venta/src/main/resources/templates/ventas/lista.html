<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Lista de Ventas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div id="wrapper">
    <!-- Navbar Lateral (Sidebar) -->
    <div th:replace="~{fragments/sidebar :: sidebar(activeService='ventas', activePage='lista')}"></div>

    <!-- Contenido Principal -->
    <div id="page-content-wrapper">
        <div class="container-fluid">
            <div th:if="${mensaje}" class="alert alert-success alert-dismissible fade show">
                <i class="bi bi-check-circle me-1"></i> <span th:text="${mensaje}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
            <div th:if="${error}" class="alert alert-danger alert-dismissible fade show">
                <i class="bi bi-exclamation-triangle me-1"></i> <span th:text="${error}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <div class="card shadow-sm">
                <div class="card-header d-flex justify-content-between align-items-center">
                    <h4 class="mb-0"><i class="bi bi-receipt me-2"></i>Listado de Ventas</h4>
                    <a th:href="@{/web/ventas/nueva}" class="btn btn-primary btn-sm">
                        <i class="bi bi-plus-lg me-1"></i> Nueva Venta
                    </a>
                </div>
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table table-striped table-hover align-middle">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Fecha</th>
                                    <th>Calle</th>
                                    <th>Ciudad</th>
                                    <th>Cliente</th>
                                    <th>Total (CLP)</th>
                                    <th>Estado</th>
                                    <th>Acciones</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="v : ${ventas}">
                                    <td th:text="${v.id}"></td>
                                    <td th:text="${#temporals.format(v.fechaVenta, 'dd/MM/yyyy HH:mm')}"></td>
                                    <td th:text="${v.calle}"></td>
                                    <td th:text="${v.ciudad}"></td>
                                    <td><strong th:text="${v.clienteNombre}"></strong></td>
                                    <td class="fw-bold" th:text="'$' + ${v.totalVenta}"></td>
                                    <td>
                                        <span th:if="${v.estadoVenta.name() == 'COMPLETADA'}" class="badge bg-primary">COMPLETADA</span>
                                        <span th:if="${v.estadoVenta.name() == 'CANCELADA'}" class="badge bg-danger">CANCELADA</span>
                                    </td>
                                    <td>
                                        <div class="btn-group btn-group-sm">
                                            <a th:href="@{/web/ventas/{id}(id=${v.id})}" class="btn btn-info"><i class="bi bi-eye"></i> Ver</a>
                                            <a th:if="${v.estadoVenta.name() == 'COMPLETADA'}" 
                                               th:href="@{/web/ventas/{id}/cancelar(id=${v.id})}" 
                                               class="btn btn-danger" 
                                               onclick="return confirm('¿Seguro que desea cancelar esta venta?');"><i class="bi bi-x-circle"></i> Cancelar</a>
                                        </div>
                                    </td>
                                </tr>
                                <tr th:if="${#lists.isEmpty(ventas)}">
                                    <td colspan="8" class="text-center py-4 text-muted">No hay ventas registradas.</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
