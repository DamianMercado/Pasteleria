<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Lista de Ventas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" href="#">🍰 Ventas</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav">
                <li class="nav-item"><a class="nav-link" th:href="@{/web/ventas}">Inicio</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/web/ventas/nueva}">Nueva Venta</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/web/ventas/resumen/diario}">Resumen Diario</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/web/ventas/resumen/mensual}">Resumen Mensual</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/web/ventas/resumen/anual}">Resumen Anual</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/web/ventas/estadisticas}">Estadísticas</a></li>
            </ul>
        </div>
    </div>
</nav>
<div class="container">
    <div th:if="${mensaje}" class="alert alert-success alert-dismissible fade show">
        <span th:text="${mensaje}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show">
        <span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <h2 class="mb-4">Listado de Ventas</h2>
    <table class="table table-striped table-hover">
        <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Fecha</th>
            <th>Calle</th>
            <th>Ciudad</th>
            <th>Cliente</th>
            <th>Total (CLP)</th>
            <th>Estado</th>
            <th>Acciones</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="v : ${ventas}">
            <td th:text="${v.id}"></td>
            <td th:text="${#temporals.format(v.fechaVenta, 'dd/MM/yyyy HH:mm')}"></td>
            <td th:text="${v.calle}"></td>
            <td th:text="${v.ciudad}"></td>
            <td th:text="${v.clienteNombre}"></td>
            <td th:text="${v.totalVenta}"></td>
            <td>
                <span th:if="${v.estadoVenta.name() == 'COMPLETADA'}" class="badge bg-success">COMPLETADA</span>
                <span th:if="${v.estadoVenta.name() == 'CANCELADA'}" class="badge bg-danger">CANCELADA</span>
            </td>
            <td>
                <a th:href="@{/web/ventas/{id}(id=${v.id})}" class="btn btn-sm btn-primary">Ver</a>
                <a th:if="${v.estadoVenta.name() == 'COMPLETADA'}" th:href="@{/web/ventas/{id}/cancelar(id=${v.id})}" class="btn btn-sm btn-danger" onclick="return confirm('¿Seguro que desea cancelar esta venta?');">Cancelar</a>
            </td>
        </tr>
        </tbody>
    </table>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
