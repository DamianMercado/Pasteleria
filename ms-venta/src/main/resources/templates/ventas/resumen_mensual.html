<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Resumen Mensual</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" href="#">🍰 Ventas</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav">
                <li class="nav-item"><a class="nav-link" th:href="@{/web/ventas}">Inicio</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/web/ventas/nueva}">Nueva Venta</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/web/ventas/resumen/diario}">Resumen Diario</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/web/ventas/resumen/mensual}">Resumen Mensual</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/web/ventas/resumen/anual}">Resumen Anual</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/web/ventas/estadisticas}">Estadísticas</a></li>
            </ul>
        </div>
    </div>
</nav>
<div class="container">
    <h2 class="mb-4">Resumen Mensual de Ventas</h2>
    
    <form th:action="@{/web/ventas/resumen/mensual}" method="get" class="mb-4">
        <div class="row align-items-end">
            <div class="col-md-3">
                <label class="form-label">Año</label>
                <input type="number" name="anio" class="form-control" th:value="${anioSeleccionado}" required min="2000">
            </div>
            <div class="col-md-3">
                <button type="submit" class="btn btn-primary">Filtrar</button>
            </div>
        </div>
    </form>

    <table class="table table-striped table-hover">
        <thead class="table-dark">
        <tr>
            <th>Mes</th>
            <th>Total Ventas (CLP)</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="entry : ${resumen}">
            <td th:text="${entry.key}"></td>
            <td th:text="${entry.value}"></td>
        </tr>
        </tbody>
        <tfoot>
        <tr>
            <th class="text-end">Total Anual:</th>
            <th th:text="${totalAnual}"></th>
        </tr>
        </tfoot>
    </table>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
