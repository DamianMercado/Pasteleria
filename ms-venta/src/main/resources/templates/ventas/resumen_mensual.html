<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Resumen Mensual</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div id="wrapper">
    <!-- Navbar Lateral (Sidebar) -->
    <div th:replace="~{fragments/sidebar :: sidebar(activeService='ventas', activePage='mensual')}"></div>

    <!-- Contenido Principal -->
    <div id="page-content-wrapper">
        <div class="container-fluid">
            <!-- Formulario de Filtro en Card -->
            <div class="card shadow-sm mb-4">
                <div class="card-header">
                    <h5 class="mb-0"><i class="bi bi-calendar3 me-2"></i>Filtrar Resumen Mensual</h5>
                </div>
                <div class="card-body">
                    <form th:action="@{/web/ventas/resumen/mensual}" method="get">
                        <div class="row align-items-end g-3">
                            <div class="col-md-4">
                                <label class="form-label">Seleccionar Año</label>
                                <input type="number" name="anio" class="form-control" th:value="${anioSeleccionado}" required min="2000">
                            </div>
                            <div class="col-md-3">
                                <button type="submit" class="btn btn-primary px-4"><i class="bi bi-funnel me-1"></i> Filtrar</button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>

            <!-- Tabla en Card -->
            <div class="card shadow-sm">
                <div class="card-header d-flex justify-content-between align-items-center">
                    <h5 class="mb-0"><i class="bi bi-bar-chart me-2"></i>Ventas por Mes (<span th:text="${anioSeleccionado}"></span>)</h5>
                    <span class="badge bg-primary fs-6" th:text="'Total: $' + ${totalAnual}"></span>
                </div>
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table table-striped table-hover align-middle">
                            <thead>
                                <tr>
                                    <th>Mes</th>
                                    <th>Total Ventas (CLP)</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="entry : ${resumen}">
                                    <td class="fw-semibold" th:text="${entry.key}"></td>
                                    <td class="fw-bold" th:text="'$' + ${entry.value}"></td>
                                </tr>
                            </tbody>
                            <tfoot>
                                <tr style="background-color: #f2d6a1;">
                                    <th class="text-end">Total Anual:</th>
                                    <th class="fw-bold fs-5" style="color: #f1a805;" th:text="'$' + ${totalAnual}"></th>
                                </tr>
                            </tfoot>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
