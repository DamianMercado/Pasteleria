<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cambiar Estado de Venta</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div id="wrapper">
    <!-- Navbar Lateral (Sidebar) -->
    <div th:replace="~{fragments/sidebar :: sidebar(activeService='ventas', activePage='lista')}"></div>

    <!-- Contenido Principal -->
    <div id="page-content-wrapper">
        <div class="container-fluid">
            <div class="row justify-content-center">
                <div class="col-lg-6 col-md-8">
                    <div class="card shadow-sm">
                        <div class="card-header">
                            <h4 class="mb-0"><i class="bi bi-arrow-repeat me-2"></i>Cambiar Estado - Venta #<span th:text="${venta.id}"></span></h4>
                        </div>
                        <div class="card-body p-4">
                            <!-- Datos actuales -->
                            <div class="p-3 mb-4 rounded" style="background-color: #fdfaf6; border: 1px solid #edd5c0;">
                                <p class="mb-2"><strong>Cliente:</strong> <span th:text="${venta.clienteNombre}"></span></p>
                                <p class="mb-0"><strong>Estado Actual:</strong> 
                                    <span th:text="${venta.estadoVenta}" class="badge bg-secondary"></span>
                                </p>
                            </div>
                            
                            <form th:action="@{/web/ventas/{id}/estado(id=${venta.id})}" th:object="${actualizarEstado}" method="post">
                                <div class="mb-3">
                                    <label class="form-label">Nuevo Estado:</label>
                                    <select class="form-select" th:field="*{nuevoEstado}" required>
                                        <option th:each="estado : ${T(org.melosas.pasteleria.enums.EstadoVenta).values()}" 
                                                th:value="${estado}" th:text="${estado}"></option>
                                    </select>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">Motivo (Opcional):</label>
                                    <input type="text" class="form-control" th:field="*{motivo}" placeholder="Razón del cambio de estado..." />
                                </div>
                                <div class="mt-4 pt-3 border-top d-flex gap-2">
                                    <button type="submit" class="btn btn-primary px-4"><i class="bi bi-check-circle me-1"></i> Actualizar Estado</button>
                                    <a th:href="@{/web/ventas/{id}(id=${venta.id})}" class="btn btn-info px-3"><i class="bi bi-receipt me-1"></i> Detalle</a>
                                    <a th:href="@{/web/ventas}" class="btn btn-secondary px-3"><i class="bi bi-arrow-left me-1"></i> Volver a Lista</a>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
