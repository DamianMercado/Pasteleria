<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Detalle de Venta</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div id="wrapper">
    <!-- Navbar Lateral (Sidebar) -->
    <div th:replace="~{fragments/sidebar :: sidebar(activeService='ventas', activePage='lista')}"></div>

    <!-- Contenido Principal -->
    <div id="page-content-wrapper">
        <div class="container-fluid">
            <div th:if="${mensaje}" class="alert alert-success alert-dismissible fade show">
                <i class="bi bi-check-circle me-1"></i> <span th:text="${mensaje}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
            <div th:if="${error}" class="alert alert-danger alert-dismissible fade show">
                <i class="bi bi-exclamation-triangle me-1"></i> <span th:text="${error}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <div class="d-flex justify-content-between align-items-center mb-4">
                <h3 class="mb-0 fw-bold"><i class="bi bi-receipt me-2"></i>Detalle de Venta #<span th:text="${venta.id}"></span></h3>
                <div class="d-flex gap-2">
                    <a th:href="@{/web/ventas/{id}/estado(id=${venta.id})}" class="btn btn-primary"><i class="bi bi-arrow-repeat me-1"></i> Cambiar Estado</a>
                    <a th:href="@{/web/ventas}" class="btn btn-secondary"><i class="bi bi-arrow-left me-1"></i> Volver a la Lista</a>
                </div>
            </div>
            
            <div class="card shadow-sm mb-4">
                <div class="card-header">
                    <h5 class="mb-0"><i class="bi bi-info-circle me-2"></i>Información General de la Venta</h5>
                </div>
                <div class="card-body">
                    <div class="row">
                        <div class="col-md-6">
                            <p><strong>Fecha y Hora:</strong> <span th:text="${#temporals.format(venta.fechaVenta, 'dd/MM/yyyy HH:mm')}"></span></p>
                            <p><strong>Cliente:</strong> <span class="fw-bold" th:text="${venta.clienteNombre}"></span></p>
                            <p><strong>Dirección:</strong> <span th:text="${venta.calle + ', ' + venta.ciudad}"></span></p>
                        </div>
                        <div class="col-md-6">
                            <p><strong>Estado:</strong> 
                                <span th:if="${venta.estadoVenta.name() == 'COMPLETADA'}" class="badge bg-primary">COMPLETADA</span>
                                <span th:if="${venta.estadoVenta.name() == 'CANCELADA'}" class="badge bg-danger">CANCELADA</span>
                            </p>
                            <p><strong>Notas:</strong> <span th:text="${venta.notas}"></span></p>
                            <p class="fs-5"><strong>Total (CLP):</strong> <span class="fw-bold" style="color: #f1a805;" th:text="'$' + ${venta.totalVenta}"></span></p>
                        </div>
                    </div>
                </div>
            </div>

            <div class="card shadow-sm mb-4">
                <div class="card-header">
                    <h5 class="mb-0"><i class="bi bi-cake2 me-2"></i>Productos Vendidos</h5>
                </div>
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table table-striped table-hover align-middle">
                            <thead>
                                <tr>
                                    <th>Código</th>
                                    <th>Nombre</th>
                                    <th>Cantidad</th>
                                    <th>Precio Unit.</th>
                                    <th>Subtotal</th>
                                    <th>¿Venta Costo?</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="item : ${venta.items}">
                                    <td><strong th:text="${item.codigoPastel}"></strong></td>
                                    <td th:text="${item.nombrePastel}"></td>
                                    <td th:text="${item.cantidad}"></td>
                                    <td th:text="'$' + ${item.precioUnitario}"></td>
                                    <td class="fw-bold" th:text="'$' + ${item.precioUnitario * item.cantidad}"></td>
                                    <td>
                                        <span th:if="${item.vendidoACosto}" class="badge bg-warning">Sí</span>
                                        <span th:unless="${item.vendidoACosto}" class="badge bg-secondary">No</span>
                                    </td>
                                </tr>
                            </tbody>
                            <tfoot>
                                <tr style="background-color: #f2d6a1;">
                                    <th colspan="4" class="text-end">Total Venta:</th>
                                    <th class="fw-bold fs-5" style="color: #f1a805;" th:text="'$' + ${venta.totalVenta}"></th>
                                    <th></th>
                                </tr>
                            </tfoot>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
