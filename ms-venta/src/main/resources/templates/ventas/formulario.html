<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Nueva Venta</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div id="wrapper">
    <!-- Navbar Lateral (Sidebar) -->
    <div th:replace="~{fragments/sidebar :: sidebar(activeService='ventas', activePage='nueva')}"></div>

    <!-- Contenido Principal -->
    <div id="page-content-wrapper">
        <div class="container-fluid">
            <div th:if="${mensaje}" class="alert alert-success alert-dismissible fade show">
                <i class="bi bi-check-circle me-1"></i> <span th:text="${mensaje}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
            <div th:if="${error}" class="alert alert-danger alert-dismissible fade show">
                <i class="bi bi-exclamation-triangle me-1"></i> <span th:text="${error}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <!-- Formulario envuelto en Card Principal -->
            <div class="card shadow-sm">
                <div class="card-header">
                    <h4><i class="bi bi-cart-plus me-2"></i>Registrar Nueva Venta</h4>
                </div>
                <form th:action="@{/web/ventas/guardar}" method="post">
                    <div class="card-body p-4">
                        <!-- Sección 1: Datos de la Venta -->
                        <div class="card mb-4" style="border-color: #edd5c0;">
                            <div class="card-header py-2" style="background: #f2d6a1;">
                                <h6 class="card-title mb-0"><i class="bi bi-geo-alt me-1"></i> Datos de la Venta</h6>
                            </div>
                            <div class="card-body">
                                <div class="row mb-3">
                                    <div class="col-md-6">
                                        <label class="form-label">Calle</label>
                                        <input type="text" name="calle" class="form-control" required placeholder="Calle y número">
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label">Ciudad</label>
                                        <input type="text" name="ciudad" class="form-control" required placeholder="Ciudad">
                                    </div>
                                </div>
                                <div class="row">
                                    <div class="col-md-6 mb-3">
                                        <label class="form-label">Cliente (Opcional)</label>
                                        <input type="text" name="clienteNombre" class="form-control" placeholder="Nombre del cliente">
                                    </div>
                                    <div class="col-md-6 mb-3">
                                        <label class="form-label">Notas</label>
                                        <textarea name="notas" class="form-control" rows="2" placeholder="Observaciones de la entrega o venta..."></textarea>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Sección 2: Información de Pago -->
                        <div class="card mb-4" style="border-color: #edd5c0;">
                            <div class="card-header py-2" style="background: #f2d6a1;">
                                <h6 class="card-title mb-0"><i class="bi bi-credit-card me-1"></i> Información de Pago</h6>
                            </div>
                            <div class="card-body">
                                <div class="row">
                                    <div class="col-md-6 mb-3">
                                        <label class="form-label">Método de Pago</label>
                                        <select name="metodoPago" id="metodoPago" class="form-select" onchange="onMetodoPagoChange(this)" required>
                                            <option value="EFECTIVO" selected>Efectivo</option>
                                            <option value="TRANSFERENCIA">Transferencia</option>
                                            <option value="CREDITO">Tarjeta de Crédito / Débito</option>
                                            <option value="FIADO">Fiado</option>
                                        </select>
                                    </div>
                                    <div class="col-md-6 mb-3" id="fechaVencimientoPagoDiv" style="display: none;">
                                        <label class="form-label">Fecha de Vencimiento del Pago</label>
                                        <input type="date" name="fechaVencimientoPago" id="fechaVencimientoPago" class="form-control" />
                                        <small class="text-muted">Ingrese la fecha límite para saldar la deuda.</small>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Sección 3: Productos -->
                        <div class="card mb-3" style="border-color: #edd5c0;">
                            <div class="card-header py-2 d-flex justify-content-between align-items-center" style="background: #f2d6a1;">
                                <h6 class="card-title mb-0"><i class="bi bi-cake2 me-1"></i> Productos</h6>
                                <button type="button" class="btn btn-sm btn-primary" onclick="agregarFila()">
                                    <i class="bi bi-plus-lg me-1"></i> Agregar Producto
                                </button>
                            </div>
                            <div class="card-body">
                                <div id="items-container">
                                    <div class="row mb-3 item-row align-items-center">
                                        <div class="col-md-2 mb-2">
                                            <label class="form-label small mb-1">Cód. Pastel</label>
                                            <select name="codigoPastel" class="form-select form-select-sm codigo-pastel-select" onchange="onCodigoSelected(this)" required>
                                                <option value="">-- Seleccionar --</option>
                                                <option th:each="cod : ${codigosCompra}" th:value="${cod}" th:text="${cod}"></option>
                                            </select>
                                        </div>
                                        <div class="col-md-3 mb-2">
                                            <label class="form-label small mb-1">Nombre Pastel</label>
                                            <input type="text" name="nombrePastel" class="form-control form-control-sm nombre-pastel-input" placeholder="Nombre en inventario" readonly style="background-color: #e9ecef;" required>
                                        </div>
                                        <div class="col-md-2 mb-2">
                                            <label class="form-label small mb-1">Cantidad</label>
                                            <input type="number" name="cantidad" class="form-control form-control-sm cantidad-input" min="1" oninput="validarCantidad(this)" onkeydown="if(event.key === '-' || event.key === 'e') event.preventDefault();" placeholder="0" required>
                                            <div class="stock-info mt-1" style="font-size: 0.75rem;"></div>
                                        </div>
                                        <div class="col-md-2 mb-2">
                                            <label class="form-label small mb-1">Precio Unit. (CLP)</label>
                                            <input type="number" step="any" min="0" name="precioUnitario" class="form-control form-control-sm precio-unitario-input" readonly style="background-color: #e9ecef; cursor: not-allowed;" placeholder="0.00" required>
                                        </div>
                                        <div class="col-md-2 mb-2">
                                            <label class="form-label small mb-1">¿Aplica venta a costo?</label>
                                            <select name="vendidoACosto" class="form-select form-select-sm venta-costo-select" onchange="onVentaCostoChange(this)" disabled>
                                                <option value="false">No aplica</option>
                                                <option value="true">Sí</option>
                                            </select>
                                            <div class="vencimiento-info mt-1" style="font-size: 0.75rem;"></div>
                                        </div>
                                        <div class="col-md-1 mb-2 d-flex align-items-center pt-3">
                                            <button type="button" class="btn btn-outline-danger btn-sm w-100" onclick="eliminarFila(this)" title="Eliminar fila">
                                                <i class="bi bi-trash"></i>
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Botones dentro de la Card Footer -->
                    <div class="card-footer d-flex gap-2">
                        <button type="submit" class="btn btn-primary px-4"><i class="bi bi-check-lg me-1"></i> Registrar Venta</button>
                        <a th:href="@{/web/ventas}" class="btn btn-secondary px-4"><i class="bi bi-x-circle me-1"></i> Cancelar</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script>
    function onCodigoSelected(selectElem) {
        const row = selectElem.closest('.item-row');
        const codigo = selectElem.value;
        const nombreInput = row.querySelector('.nombre-pastel-input');
        const cantidadInput = row.querySelector('.cantidad-input');
        const precioInput = row.querySelector('.precio-unitario-input');
        const costoSelect = row.querySelector('.venta-costo-select');
        const vencimientoInfo = row.querySelector('.vencimiento-info');
        const stockInfo = row.querySelector('.stock-info');

        if (!codigo) {
            nombreInput.value = '';
            precioInput.value = '';
            precioInput.removeAttribute('data-precio-venta');
            precioInput.removeAttribute('data-precio-costo');
            cantidadInput.removeAttribute('data-stock');
            cantidadInput.removeAttribute('max');
            costoSelect.value = 'false';
            costoSelect.disabled = true;
            vencimientoInfo.innerHTML = '';
            stockInfo.innerHTML = '';
            validarCantidad(cantidadInput);
            return;
        }

        fetch('/web/ventas/api/producto/' + encodeURIComponent(codigo))
            .then(res => res.ok ? res.json() : null)
            .then(data => {
                if (data) {
                    nombreInput.value = data.nombrePastel || '';
                    const pVenta = data.precioVenta != null ? data.precioVenta : '';
                    const pCosto = data.precioCosto != null ? data.precioCosto : '';
                    precioInput.setAttribute('data-precio-venta', pVenta);
                    precioInput.setAttribute('data-precio-costo', pCosto);
                    precioInput.value = pVenta;

                    // Manejo de stock
                    const stock = data.stock != null ? parseInt(data.stock) : 0;
                    cantidadInput.setAttribute('data-stock', stock);
                    cantidadInput.setAttribute('max', stock);

                    if (stock > 0) {
                        stockInfo.innerHTML = '<span class="badge bg-info text-dark stock-badge"><i class="bi bi-boxes me-1"></i>Stock: ' + stock + '</span>';
                        if (!cantidadInput.value || parseInt(cantidadInput.value) <= 0) {
                            cantidadInput.value = 1;
                        }
                    } else {
                        stockInfo.innerHTML = '<span class="badge bg-danger stock-badge"><i class="bi bi-exclamation-octagon me-1"></i>Sin stock (0)</span>';
                    }

                    if (data.vencido === true) {
                        costoSelect.disabled = false;
                        vencimientoInfo.innerHTML = '<span class="text-danger fw-bold"><i class="bi bi-exclamation-circle me-1"></i>Vencido (habilitado)</span>';
                    } else {
                        costoSelect.value = 'false';
                        costoSelect.disabled = true;
                        vencimientoInfo.innerHTML = '<span class="text-success"><i class="bi bi-check-circle me-1"></i>Vigente</span>';
                    }

                    validarCantidad(cantidadInput);
                }
            })
            .catch(err => {
                console.error('Error al cargar datos del producto', err);
            });
    }

    function validarCantidad(input) {
        const row = input.closest('.item-row');
        const stockInfo = row.querySelector('.stock-info');
        if (!input.hasAttribute('data-stock')) return;

        const maxStock = parseInt(input.getAttribute('data-stock')) || 0;
        const val = parseInt(input.value);

        let errElem = row.querySelector('.error-stock-msg');
        if (!errElem) {
            errElem = document.createElement('div');
            errElem.className = 'text-danger small mt-1 error-stock-msg';
            stockInfo.parentNode.appendChild(errElem);
        }

        if (maxStock <= 0) {
            input.classList.add('is-invalid');
            errElem.textContent = '⚠️ Sin stock disponible';
            errElem.style.display = 'block';
        } else if (isNaN(val) || val <= 0) {
            input.classList.add('is-invalid');
            errElem.textContent = '⚠️ Ingrese cantidad válida (mín: 1)';
            errElem.style.display = 'block';
        } else if (val > maxStock) {
            input.classList.add('is-invalid');
            errElem.textContent = '⚠️ Supera stock disponible (máx: ' + maxStock + ')';
            errElem.style.display = 'block';
        } else {
            input.classList.remove('is-invalid');
            errElem.style.display = 'none';
        }
    }

    function onVentaCostoChange(selectElem) {
        const row = selectElem.closest('.item-row');
        const precioInput = row.querySelector('.precio-unitario-input');
        if (selectElem.value === 'true') {
            const pCosto = precioInput.getAttribute('data-precio-costo');
            if (pCosto) {
                precioInput.value = pCosto;
            }
        } else {
            const pVenta = precioInput.getAttribute('data-precio-venta');
            if (pVenta) {
                precioInput.value = pVenta;
            }
        }
    }

    function agregarFila() {
        const container = document.getElementById('items-container');
        const firstRow = container.querySelector('.item-row');
        const newRow = firstRow.cloneNode(true);
        
        newRow.querySelector('.codigo-pastel-select').value = '';
        newRow.querySelector('.nombre-pastel-input').value = '';
        const cantidadInput = newRow.querySelector('.cantidad-input');
        cantidadInput.value = '';
        cantidadInput.removeAttribute('data-stock');
        cantidadInput.removeAttribute('max');
        cantidadInput.classList.remove('is-invalid');

        const precioInput = newRow.querySelector('.precio-unitario-input');
        precioInput.value = '';
        precioInput.removeAttribute('data-precio-venta');
        precioInput.removeAttribute('data-precio-costo');
        
        const costoSelect = newRow.querySelector('.venta-costo-select');
        costoSelect.value = 'false';
        costoSelect.disabled = true;
        
        newRow.querySelector('.vencimiento-info').innerHTML = '';
        newRow.querySelector('.stock-info').innerHTML = '';
        const oldErrMsg = newRow.querySelector('.error-stock-msg');
        if (oldErrMsg) oldErrMsg.remove();

        container.appendChild(newRow);
    }

    function eliminarFila(btn) {
        const container = document.getElementById('items-container');
        const rows = container.querySelectorAll('.item-row');
        if (rows.length > 1) {
            btn.closest('.item-row').remove();
        } else {
            const row = rows[0];
            row.querySelector('.codigo-pastel-select').value = '';
            row.querySelector('.nombre-pastel-input').value = '';
            const cantidadInput = row.querySelector('.cantidad-input');
            cantidadInput.value = '';
            cantidadInput.removeAttribute('data-stock');
            cantidadInput.removeAttribute('max');
            cantidadInput.classList.remove('is-invalid');

            const precioInput = row.querySelector('.precio-unitario-input');
            precioInput.value = '';
            precioInput.removeAttribute('data-precio-venta');
            precioInput.removeAttribute('data-precio-costo');
            const costoSelect = row.querySelector('.venta-costo-select');
            costoSelect.value = 'false';
            costoSelect.disabled = true;
            row.querySelector('.vencimiento-info').innerHTML = '';
            row.querySelector('.stock-info').innerHTML = '';
            const oldErrMsg = row.querySelector('.error-stock-msg');
            if (oldErrMsg) oldErrMsg.remove();
        }
    }

    function onMetodoPagoChange(selectElem) {
        const div = document.getElementById('fechaVencimientoPagoDiv');
        const input = document.getElementById('fechaVencimientoPago');
        if (selectElem.value === 'FIADO') {
            div.style.display = 'block';
            input.required = true;
        } else {
            div.style.display = 'none';
            input.required = false;
            input.value = '';
        }
    }

    document.addEventListener('DOMContentLoaded', function() {
        const metodoSelect = document.getElementById('metodoPago');
        if (metodoSelect) {
            onMetodoPagoChange(metodoSelect);
        }

        const form = document.querySelector('form');
        if (form) {
            form.addEventListener('submit', function(e) {
                let errorMsg = null;
                const rows = document.querySelectorAll('.item-row');
                for (const r of rows) {
                    const cod = r.querySelector('.codigo-pastel-select').value;
                    if (!cod) continue;
                    const cantInput = r.querySelector('.cantidad-input');
                    const cant = parseInt(cantInput.value);
                    const maxStock = parseInt(cantInput.getAttribute('data-stock'));

                    if (isNaN(cant) || cant <= 0) {
                        errorMsg = 'La cantidad debe ser mayor a 0 para el producto ' + cod;
                        cantInput.focus();
                        break;
                    }
                    if (!isNaN(maxStock)) {
                        if (maxStock <= 0) {
                            errorMsg = 'El producto ' + cod + ' no tiene stock disponible en inventario.';
                            cantInput.focus();
                            break;
                        }
                        if (cant > maxStock) {
                            errorMsg = 'La cantidad solicitada para ' + cod + ' (' + cant + ') supera el stock disponible (' + maxStock + ').';
                            cantInput.focus();
                            break;
                        }
                    }
                }

                if (errorMsg) {
                    e.preventDefault();
                    alert(errorMsg);
                    return false;
                }

                // Habilitar todos los select para que su valor ('false' o 'true') se envíe al backend
                document.querySelectorAll('.venta-costo-select').forEach(sel => {
                    sel.disabled = false;
                });
            });
        }
    });
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
