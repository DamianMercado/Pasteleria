<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Nueva Venta</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" href="#">🍰 Ventas</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav">
                <li class="nav-item"><a class="nav-link" th:href="@{/web/ventas}">Inicio</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/web/ventas/nueva}">Nueva Venta</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/web/ventas/resumen/diario}">Resumen Diario</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/web/ventas/resumen/mensual}">Resumen Mensual</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/web/ventas/resumen/anual}">Resumen Anual</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/web/ventas/estadisticas}">Estadísticas</a></li>
            </ul>
        </div>
    </div>
</nav>
<div class="container">
    <div th:if="${mensaje}" class="alert alert-success alert-dismissible fade show">
        <span th:text="${mensaje}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show">
        <span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <h2 class="mb-4">Registrar Nueva Venta</h2>
    <form th:action="@{/web/ventas/guardar}" method="post">
        <div class="card mb-4">
            <div class="card-header bg-secondary text-white">Datos de la Venta</div>
            <div class="card-body">
                <div class="row mb-3">
                    <div class="col-md-6">
                        <label class="form-label">Calle</label>
                        <input type="text" name="calle" class="form-control" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Ciudad</label>
                        <input type="text" name="ciudad" class="form-control" required>
                    </div>
                </div>
                <div class="row mb-3">
                    <div class="col-md-6">
                        <label class="form-label">Cliente (Opcional)</label>
                        <input type="text" name="clienteNombre" class="form-control">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Notas</label>
                        <textarea name="notas" class="form-control"></textarea>
                    </div>
                </div>
            </div>
        </div>

        <div class="card mb-4">
            <div class="card-header bg-secondary text-white">Productos</div>
            <div class="card-body">
                <div id="items-container">
                    <div class="row mb-3 item-row" th:each="i : ${#numbers.sequence(1,3)}">
                        <div class="col-md-2">
                            <label class="form-label">Cód. Pastel</label>
                            <input type="text" name="codigoPastel" class="form-control" th:required="${i == 1}">
                        </div>
                        <div class="col-md-3">
                            <label class="form-label">Nombre Pastel</label>
                            <input type="text" name="nombrePastel" class="form-control" th:required="${i == 1}">
                        </div>
                        <div class="col-md-2">
                            <label class="form-label">Cantidad</label>
                            <input type="number" name="cantidad" class="form-control" th:required="${i == 1}" min="1">
                        </div>
                        <div class="col-md-3">
                            <label class="form-label">Precio Unit.</label>
                            <input type="number" step="1" name="precioUnitario" class="form-control" th:required="${i == 1}" min="0">
                        </div>
                        <div class="col-md-2 d-flex align-items-end pb-2">
                            <div class="form-check">
                                <!-- Hidden field to ensure array alignment if checkbox is unchecked -->
                                <input type="hidden" name="vendidoACosto" value="false">
                                <input class="form-check-input costo-cb" type="checkbox" onclick="this.previousElementSibling.disabled = this.checked; this.value='true'" name="vendidoACosto">
                                <label class="form-check-label">Venta Costo</label>
                            </div>
                        </div>
                    </div>
                </div>
                <button type="button" class="btn btn-secondary mt-2" onclick="agregarFila()">+ Agregar Producto</button>
            </div>
        </div>
        
        <button type="submit" class="btn btn-success btn-lg">Registrar Venta</button>
    </form>
</div>
<script>
    function agregarFila() {
        const container = document.getElementById('items-container');
        const firstRow = container.querySelector('.item-row');
        const newRow = firstRow.cloneNode(true);
        // Clear values
        newRow.querySelectorAll('input:not([type="hidden"]):not([type="checkbox"])').forEach(input => {
            input.value = '';
            input.required = false; // Solo la primera fila es obligatoria
        });
        newRow.querySelector('.costo-cb').checked = false;
        newRow.querySelector('.costo-cb').value = 'on'; // default before check
        newRow.querySelector('input[type="hidden"]').disabled = false;
        container.appendChild(newRow);
    }
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
