<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Productos Más Vendidos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" href="#">🍰 Ventas</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav">
                <li class="nav-item"><a class="nav-link" th:href="@{/web/ventas}">Inicio</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/web/ventas/nueva}">Nueva Venta</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/web/ventas/resumen/diario}">Resumen Diario</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/web/ventas/resumen/mensual}">Resumen Mensual</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/web/ventas/resumen/anual}">Resumen Anual</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/web/ventas/estadisticas}">Estadísticas</a></li>
            </ul>
        </div>
    </div>
</nav>
<div class="container">
    <h2 class="mb-4">Productos Más Vendidos</h2>

    <table class="table table-striped table-hover">
        <thead class="table-dark">
        <tr>
            <th>Posición</th>
            <th>Código Pastel</th>
            <th>Nombre</th>
            <th>Total Vendido</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="prod, iterStat : ${productos}">
            <td>
                <span th:if="${iterStat.index == 0}">🏆</span>
                <span th:text="${iterStat.count}"></span>
            </td>
            <td th:text="${prod.codigoPastel}"></td>
            <td th:text="${prod.nombrePastel}"></td>
            <td th:text="${prod.totalVendido}"></td>
        </tr>
        </tbody>
    </table>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
