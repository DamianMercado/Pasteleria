<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Productos Más Vendidos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div id="wrapper">
    <!-- Navbar Lateral (Sidebar) -->
    <div th:replace="~{fragments/sidebar :: sidebar(activeService='ventas', activePage='estadisticas')}"></div>

    <!-- Contenido Principal -->
    <div id="page-content-wrapper">
        <div class="container-fluid">
            <div class="card shadow-sm">
                <div class="card-header">
                    <h4 class="mb-0"><i class="bi bi-trophy me-2"></i>Ranking de Productos Más Vendidos</h4>
                </div>
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table table-striped table-hover align-middle">
                            <thead>
                                <tr>
                                    <th style="width: 100px;">Posición</th>
                                    <th>Código Pastel</th>
                                    <th>Nombre del Pastel</th>
                                    <th>Total Vendido (Unidades)</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="prod, iterStat : ${productos}">
                                    <td>
                                        <span th:if="${iterStat.index == 0}" class="badge bg-warning fs-6">🥇 1°</span>
                                        <span th:if="${iterStat.index == 1}" class="badge bg-info fs-6">🥈 2°</span>
                                        <span th:if="${iterStat.index == 2}" class="badge bg-secondary fs-6">🥉 3°</span>
                                        <span th:if="${iterStat.index > 2}" class="badge bg-light text-dark fs-6" th:text="${iterStat.count} + '°'"></span>
                                    </td>
                                    <td><strong th:text="${prod.codigoPastel}"></strong></td>
                                    <td class="fw-semibold" th:text="${prod.nombrePastel}"></td>
                                    <td><strong class="fs-6" style="color: #f1a805;" th:text="${prod.totalVendido}"></strong></td>
                                </tr>
                                <tr th:if="${#lists.isEmpty(productos)}">
                                    <td colspan="4" class="text-center py-4 text-muted">No hay estadísticas de ventas disponibles.</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
