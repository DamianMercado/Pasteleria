<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Resumen Diario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div id="wrapper">
    <!-- Navbar Lateral (Sidebar) -->
    <div th:replace="~{fragments/sidebar :: sidebar(activeService='ventas', activePage='diario')}"></div>

    <!-- Contenido Principal -->
    <div id="page-content-wrapper">
        <div class="container-fluid">
            <!-- Card de Filtro (Formulario en Card) -->
            <div class="card shadow-sm mb-4">
                <div class="card-header">
                    <h5 class="mb-0"><i class="bi bi-calendar-event me-2"></i>Filtrar Resumen Diario</h5>
                </div>
                <div class="card-body">
                    <form th:action="@{/web/ventas/resumen/diario}" method="get">
                        <div class="row align-items-end g-3">
                            <div class="col-md-4">
                                <label class="form-label">Seleccionar Fecha</label>
                                <input type="date" name="fecha" class="form-control" th:value="${fechaSeleccionada}" required>
                            </div>
                            <div class="col-md-3">
                                <button type="submit" class="btn btn-primary px-4"><i class="bi bi-funnel me-1"></i> Filtrar</button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>

            <!-- Resumen Estadístico en Cards -->
            <div class="row mb-4">
                <div class="col-md-6">
                    <div class="card shadow-sm h-100" style="border-left: 5px solid #f1a805;">
                        <div class="card-body">
                            <h6 class="text-muted fw-bold">TOTAL DEL DÍA (CLP)</h6>
                            <h2 class="fw-bold mb-0" style="color: #f1a805;" th:text="'$' + ${total}"></h2>
                        </div>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="card shadow-sm h-100" style="border-left: 5px solid #92ada4;">
                        <div class="card-body">
                            <h6 class="text-muted fw-bold">CANTIDAD DE VENTAS</h6>
                            <h2 class="fw-bold mb-0" style="color: #749288;" th:text="${cantidad}"></h2>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Tabla de Ventas en Card -->
            <div class="card shadow-sm">
                <div class="card-header">
                    <h5 class="mb-0"><i class="bi bi-receipt me-2"></i>Ventas de este día</h5>
                </div>
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table table-striped table-hover align-middle">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Hora</th>
                                    <th>Cliente</th>
                                    <th>Total (CLP)</th>
                                    <th>Estado</th>
                                    <th>Acciones</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="v : ${ventas}">
                                    <td th:text="${v.id}"></td>
                                    <td th:text="${#temporals.format(v.fechaVenta, 'HH:mm')}"></td>
                                    <td th:text="${v.clienteNombre}"></td>
                                    <td class="fw-bold" th:text="'$' + ${v.totalVenta}"></td>
                                    <td>
                                        <span th:if="${v.estadoVenta.name() == 'COMPLETADA'}" class="badge bg-primary">COMPLETADA</span>
                                        <span th:if="${v.estadoVenta.name() == 'CANCELADA'}" class="badge bg-danger">CANCELADA</span>
                                    </td>
                                    <td>
                                        <a th:href="@{/web/ventas/{id}(id=${v.id})}" class="btn btn-sm btn-info"><i class="bi bi-eye"></i> Ver</a>
                                    </td>
                                </tr>
                                <tr th:if="${#lists.isEmpty(ventas)}">
                                    <td colspan="6" class="text-center py-4 text-muted">No se registraron ventas en la fecha seleccionada.</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
