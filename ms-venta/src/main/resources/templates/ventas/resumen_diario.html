<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Resumen Diario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" href="#">🍰 Ventas</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav">
                <li class="nav-item"><a class="nav-link" th:href="@{/web/ventas}">Inicio</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/web/ventas/nueva}">Nueva Venta</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/web/ventas/resumen/diario}">Resumen Diario</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/web/ventas/resumen/mensual}">Resumen Mensual</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/web/ventas/resumen/anual}">Resumen Anual</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/web/ventas/estadisticas}">Estadísticas</a></li>
            </ul>
        </div>
    </div>
</nav>
<div class="container">
    <h2 class="mb-4">Resumen Diario de Ventas</h2>
    
    <form th:action="@{/web/ventas/resumen/diario}" method="get" class="mb-4">
        <div class="row align-items-end">
            <div class="col-md-4">
                <label class="form-label">Fecha</label>
                <input type="date" name="fecha" class="form-control" th:value="${fechaSeleccionada}" required>
            </div>
            <div class="col-md-4">
                <button type="submit" class="btn btn-primary">Filtrar</button>
            </div>
        </div>
    </form>

    <div class="row mb-4">
        <div class="col-md-6">
            <div class="card bg-success text-white">
                <div class="card-body">
                    <h5 class="card-title">Total del Día (CLP)</h5>
                    <h2 th:text="${total}"></h2>
                </div>
            </div>
        </div>
        <div class="col-md-6">
            <div class="card bg-info text-white">
                <div class="card-body">
                    <h5 class="card-title">Cantidad de Ventas</h5>
                    <h2 th:text="${cantidad}"></h2>
                </div>
            </div>
        </div>
    </div>

    <h4>Ventas de este día</h4>
    <table class="table table-striped table-hover mt-3">
        <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Hora</th>
            <th>Cliente</th>
            <th>Total (CLP)</th>
            <th>Estado</th>
            <th>Acciones</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="v : ${ventas}">
            <td th:text="${v.id}"></td>
            <td th:text="${#temporals.format(v.fechaVenta, 'HH:mm')}"></td>
            <td th:text="${v.clienteNombre}"></td>
            <td th:text="${v.totalVenta}"></td>
            <td>
                <span th:if="${v.estadoVenta.name() == 'COMPLETADA'}" class="badge bg-success">COMPLETADA</span>
                <span th:if="${v.estadoVenta.name() == 'CANCELADA'}" class="badge bg-danger">CANCELADA</span>
            </td>
            <td>
                <a th:href="@{/web/ventas/{id}(id=${v.id})}" class="btn btn-sm btn-primary">Ver</a>
            </td>
        </tr>
        </tbody>
    </table>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
